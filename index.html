let closeoutCSV=null; // holds {filename,headers,rows,stats} for the drop currently being closed out
function findCol(headers,patterns){
  for(const p of patterns){
    const hit=headers.find(h=>p.test(h));
    if(hit) return hit;
  }
  return null;
}
function cleanMoney(v){ return parseFloat(String(v||'').replace(/[^0-9.\-]/g,''))||0; }
function analyseEntrantsCSV(headers,rows,dropId){
  const emailCol=findCol(headers,[/billing.*email/i,/^email$/i,/customer.*email/i,/email/i]);
  const orderCol=findCol(headers,[/order.*(number|id|#)/i,/^order$/i]);
  const couponCol=findCol(headers,[/coupon/i,/discount.*code/i]);
  const totalCol=findCol(headers,[/order.*total/i,/^total$/i,/grand.*total/i]);
  const nameCol=findCol(headers,[/billing.*name/i,/customer.*name/i,/^name$/i,/first.*name/i]);

  const totalEntries=rows.length;
  const orderSet=new Set(), emailSet=new Set();
  const perCustomer={}; // email -> {name,orders:Set,spend}
  let discountRows=0;

  rows.forEach(r=>{
    const email=emailCol? (r[emailCol]||'').trim().toLowerCase() : '';
    const order=orderCol? (r[orderCol]||'').trim() : '';
    if(order) orderSet.add(order);
    if(email){
      emailSet.add(email);
      perCustomer[email]=perCustomer[email]||{name:nameCol?r[nameCol]:'',orders:new Set(),spend:0};
      if(order) perCustomer[email].orders.add(order);
      if(totalCol) perCustomer[email].spend+=cleanMoney(r[totalCol]);
    }
    if(couponCol && (r[couponCol]||'').trim()) discountRows++;
  });

  const uniqueOrders=orderSet.size || totalEntries;
  const uniqueCustomers=emailSet.size || totalEntries;

  // cross-reference against the customer registry built up from previous closed-out drops
  let newCustomers=0, returningCustomers=0;
  Object.keys(perCustomer).forEach(email=>{
    const known=DB.customers.find(c=>c.email===email && c.dropIds && c.dropIds.some(id=>id!==dropId));
    if(known) returningCustomers++; else newCustomers++;
  });

  const discountUsagePct = totalEntries? Math.round((discountRows/totalEntries)*1000)/10 : 0;

  const topSpendersList=Object.entries(perCustomer)
    .map(([email,c])=>({email,name:c.name,orders:c.orders.size||1,spend:c.spend}))
    .sort((a,b)=> totalCol? (b.spend-a.spend) : (b.orders-a.orders))
    .slice(0,8)
    .map(c=> totalCol? `${c.name||c.email} — ${gbp(c.spend)} (${c.orders} order${c.orders===1?'':'s'})` : `${c.name||c.email} — ${c.orders} order${c.orders===1?'':'s'}`)
    .join('\n');

  return {totalEntries,uniqueOrders,uniqueCustomers,newCustomers,returningCustomers,discountUsagePct,topSpendersList,
    emails:Object.keys(perCustomer),perCustomer,columnsFound:{emailCol,orderCol,couponCol,totalCol,nameCol}};
}
function closeoutClaudePrompt(d){
  return `Please analyse the attached CSV export of entries/orders for ${d.number} (${watchName(d.watchId)}) and give me these figures so I can log them in Watch Drop HQ:

1. Total Entries — total number of rows/tickets in the file
2. Unique Orders — count of distinct order numbers/IDs
3. Unique Customers — count of distinct customer emails
4. New Customers — customers who appear only once in this file
5. Returning Customers — customers with more than one order in this file (note: this only reflects repeats within this file — I may separately know some of these are returning from previous drops)
6. Discount Usage (%) — percentage of rows that used a coupon/discount code
7. Top Spenders / Frequent Buyers — the top 5–8 customers by total spend (or by number of orders if there's no spend column), with name/email and their total

Please give me the answer as a short numbered list in that exact order, so I can copy the numbers straight into the app.`;

function closeoutUploadCSV(e,dropId){
  const f=e.target.files[0]; if(!f) return;
  const r=new FileReader();
  r.onload=()=>{
    const parsed=parseCSV(r.result);
    if(!parsed.rows.length){ alert('Could not find any rows in that file.'); return; }
    const stats=analyseEntrantsCSV(parsed.headers,parsed.rows,dropId);
    closeoutCSV={filename:f.name,headers:parsed.headers,rows:parsed.rows,stats};
    const set=(id,v)=>{ const el=document.getElementById(id); if(el) el.value=v; };
    set('co_totalentries',stats.totalEntries);
    set('co_orders',stats.uniqueOrders);
    set('co_uniquecust',stats.uniqueCustomers);
    set('co_newcust',stats.newCustomers);
    set('co_returncust',stats.returningCustomers);
    set('co_discountpct',stats.discountUsagePct);
    if(stats.topSpendersList) set('co_spenders',stats.topSpendersList);
    const missing=Object.entries(stats.columnsFound).filter(([k,v])=>!v).map(([k])=>k.replace('Col',''));
    const statusEl=document.getElementById('co_csv_status');
    if(statusEl){
      statusEl.innerHTML = `✓ Parsed ${parsed.rows.length} rows from <strong>${esc(f.name)}</strong> — Total Entries, Unique Orders, Unique Customers, New/Returning and Discount Usage filled in below.`
        + (missing.length? `<br><span style="color:var(--warn)">Couldn't confidently find a column for: ${missing.join(', ')} — double check the numbers above, particularly Unique Orders and Discount Usage.</span>` : '');
    }
  };
  r.onerror=()=>alert('Could not read that file.');
  r.readAsText(f);
}

  t.fixed=Number(g('co_fixed'))||0;
  t.instantWins=Number(g('co_instant'))||0;
  t.paymentFeePct=(Number(g('co_fee'))||0)/100;
  t.dial=g('co_dial'); t.setStraps=g('co_straps'); t.closeNotes=g('co_closenotes'); t.drawNotes=g('co_drawnotes');
  d.costWatch=t.watchCost; // keep legacy field aligned

  // Winner — create or update
  const wname=g('co_wname').trim();
  if(wname){
    let w = d.winnerId? winById(d.winnerId) : null;
    const dispatchedBtn=document.getElementById('co_wdispatched'), personBtn=document.getElementById('co_wperson');
    const winData={name:wname,phone:g('co_wphone'),email:g('co_wemail'),instagram:g('co_wig'),
      address:g('co_waddr'),postcode:g('co_wpostcode'),location:g('co_wlocation'),trackingNumber:g('co_wtracking'),
      dispatched: dispatchedBtn? dispatchedBtn.dataset.val==='1' : false,
      deliveryInPerson: personBtn? personBtn.dataset.val==='1' : false, dropId:d.id};
    if(w){ Object.assign(w,winData); }
    else { w={id:uid('win'),...winData,reviewRequested:false,reviewGiven:false,review:'',notes:'',created:now()}; DB.winners.unshift(w); }
    d.winnerId=w.id;
  }

  // Winners Results — create or update the one entry for this drop
  const resData={totalEntries:Number(g('co_totalentries'))||0,uniqueOrders:Number(g('co_orders'))||0,
    uniqueCustomers:Number(g('co_uniquecust'))||0,newCustomers:Number(g('co_newcust'))||0,
    returningCustomers:Number(g('co_returncust'))||0,discountUsagePct:Number(g('co_discountpct'))||0,
    topSpenders:g('co_spenders'),notes:g('co_resultnotes'),dropId:d.id,dropLabel:d.number,date:d.draw||today()};
  const existing=DB.winnerResults.find(r=>r.dropId===d.id);
  if(existing) Object.assign(existing,resData);
  else DB.winnerResults.unshift({id:uid('wr'),...resData,created:now()});

  // Persist the uploaded CSV (if any) as this drop's entrants record, and grow the
  // customer registry so future drops can tell new vs returning buyers apart.
  if(closeoutCSV){
    d.entrants={filename:closeoutCSV.filename, headers:closeoutCSV.headers, rows:closeoutCSV.rows};
    Object.entries(closeoutCSV.stats.perCustomer).forEach(([email,c])=>{
      let cust=DB.customers.find(x=>x.email===email);
      if(!cust){

        DB.customers.unshift(cust);
      } else {
        cust.dropIds=cust.dropIds||[];
        if(!cust.dropIds.includes(d.id)) cust.dropIds.push(d.id);
        cust.ordersCount=(cust.ordersCount||0)+(c.orders.size||1);
        cust.spend=(cust.spend||0)+(c.spend||0);
        cust.name=cust.name||c.name||'';
      }
    });
  }

  d.status='Complete';
  saveDB(); closeModal(); toast(`${d.number} closed out ✓`); render();
}

/* ---------- Generic modal ---------- */
function openModal(html){
  closeModal();
  const o=document.createElement('div');o.className='overlay';o.id='overlay';
  o.innerHTML=html;o.onclick=e=>{if(e.target===o)closeModal();};
  document.body.appendChild(o);
  hydrateMedia();
}
function closeModal(){const o=document.getElementById('overlay');if(o)o.remove();pendingIdeaId=null;}
function mInput(id,label,val,type='text'){return `<div class="field"><label>${label}</label><input id="${id}" type="${type}" value="${esc(val||'')}"></div>`;}
/* Like mInput but for numbers where 0 is a real, meaningful value — mInput's
   val||'' treats 0 as empty and blanks the field, which looks like the data
   is missing when it's actually just genuinely zero. */
function mNum(id,label,val){
  const shown = (val===undefined||val===null||val==='') ? '' : val;
  return `<div class="field"><label>${label}</label><input id="${id}" type="number" value="${esc(shown)}"></div>`;
}
function mArea(id,label,val){return `<div class="field"><label>${label}</label><textarea id="${id}">${esc(val||'')}</textarea></div>`;}
function useCaseChips(selected){
  const opts=['Organic Post','Paid Ad'];
  return `<div class="field"><label>Use case (select any that apply)</label>
    <div style="display:flex;gap:8px" id="cn_usecases">
      ${opts.map(o=>`<span class="pill pill-type usecase-chip${selected.includes(o)?' active':''}" data-value="${esc(o)}" onclick="this.classList.toggle('active')">${esc(o)}</span>`).join('')}
    </div></div>`;
}
function readUseCaseChips(){
  return [...document.querySelectorAll('#cn_usecases .usecase-chip.active')].map(el=>el.dataset.value);
}
function allUsedTags(){
  const freq={};
  DB.content.forEach(c=>(c.tags||[]).forEach(t=>{ if(t) freq[t]=(freq[t]||0)+1; }));
  return Object.keys(freq).sort((a,b)=>freq[b]-freq[a]);
}
const CORE_TAGS=['BTS','Winner Reveal','Odds Hook','Urgency','Live Draw','Evergreen'];
const TAG_SUGGEST_EXCLUDE=['omega'];
function tagChipsHTML(current){
  const common=allUsedTags().filter(t=>!CORE_TAGS.includes(t) && !TAG_SUGGEST_EXCLUDE.includes(t.toLowerCase())).slice(0,15);
  const all=[...CORE_TAGS,...common];
  return `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px" id="cn_tag_suggestions">
    ${all.map(t=>`<span class="pill pill-type tag-chip${current.includes(t)?' active':''}" data-value="${esc(t)}" onclick="toggleTagChip(this)">${esc(t)}</span>`).join('')}
  </div>`;
}
function toggleTagChip(el){
  el.classList.toggle('active');
  const val=el.dataset.value;
  const input=document.getElementById('cn_tags');
  let tags=input.value.split(',').map(t=>t.trim()).filter(Boolean);
  if(el.classList.contains('active')){ if(!tags.includes(val)) tags.push(val); }
  else { tags=tags.filter(t=>t!==val); }
  input.value=tags.join(', ');
}

function saveWatch(id){const g=k=>document.getElementById(k).value;
  const media=JSON.parse(JSON.stringify(watchMediaDraft));
  CONTENT_CATS.forEach(cat=>{ const k=slug(cat); media[k]=(media[k]||[]).filter(it=>!it.uploading); });
  const explicitThumb=mediaVal('w_thumb');
  const coverImg=explicitThumb||((media[slug('Watch Photos')]||[]).map(x=>x.ref).find(Boolean))||'';

/* ---------- Universal Search ---------- */
function universalSearch(q){
  q=q.toLowerCase().trim();if(!q)return[];
  const R=[];
  const push=(type,ico,label,fn)=>R.push({type,ico,label,fn});
  DB.drops.forEach(d=>{if((d.number+' '+watchName(d.watchId)+' '+d.notes+' '+d.type).toLowerCase().includes(q))
    push('Drop','⬡',`${d.number} — ${watchName(d.watchId)}`,()=>go('drop',d.id));});
  DB.watches.forEach(w=>{if((w.brand+' '+w.model+' '+w.ref+' '+(w.serial||'')+' '+(w.desc||'')).toLowerCase().includes(q))
    push('Watch','⌚',`${w.brand} ${w.model}`,()=>{go('watches');setTimeout(()=>openWatch(w.id),50);});});
  DB.winners.forEach(w=>{if((w.name+' '+(w.instagram||'')+' '+(w.notes||'')).toLowerCase().includes(q))
    push('Winner','★',w.name,()=>{go('winners');setTimeout(()=>openWinner(w.id),50);});});
  DB.suppliers.forEach(s=>{if((s.name+' '+(s.contact||'')).toLowerCase().includes(q))
    push('Supplier','▤',s.name,()=>{go('suppliers');setTimeout(()=>openSupplier(s.id),50);});});
  DB.content.forEach(c=>{if((c.title+' '+c.body+' '+(c.tags||[]).join(' ')+' '+c.category+' '+(c.creator||'')).toLowerCase().includes(q))
    push('Content','✎',c.title,()=>{go('content');setTimeout(()=>openContent(c.id),50);});});
  DB.assets.forEach(a=>{if((a.name+' '+(a.tags||[]).join(' ')+' '+a.type).toLowerCase().includes(q))
    push('Asset','▣',a.name,()=>{go('assets');setTimeout(()=>openAsset(a.id),50);});});
  DB.tasks.forEach(t=>{if((t.title+' '+(t.assignedTo||'')+' '+(t.type||'')).toLowerCase().includes(q))
    push('Task','☑',t.title,()=>go('tasks'));});
  DB.ideas.forEach(i=>{if(i.text.toLowerCase().includes(q))push('Idea','✦',i.text,()=>go('ideas'));});
  DB.sops.forEach(s=>{if((s.title+' '+s.body).toLowerCase().includes(q))push('SOP','❐',s.title,()=>{go('sops');setTimeout(()=>openSop(s.id),50);});});
  DB.kb.forEach(k=>{if((k.title+' '+k.body).toLowerCase().includes(q))push('Knowledge','◈',k.title,()=>{go('kb');setTimeout(()=>openKB(k.id),50);});});
  return R;
}
let searchIdx=[];
function doSearch(){
  const q=document.getElementById('search').value;
  const box=document.getElementById('sresults');
  if(!q.trim()){box.innerHTML='';box.style.display='none';return;}
  const res=universalSearch(q);searchIdx=res;
  if(!res.length){box.innerHTML='<div class="sresult"><span class="rt muted">No matches for "'+esc(q)+'"</span></div>';box.style.display='block';return;}
  const groups={};res.forEach((r,i)=>{(groups[r.type]=groups[r.type]||[]).push({...r,i});});
  box.innerHTML=Object.keys(groups).map(g=>`<div class="sresult-group">${g}s · ${groups[g].length}</div>`+
    groups[g].slice(0,6).map(r=>`<div class="sresult" onclick="pickSearch(${r.i})"><span class="ri">${r.ico}</span>
      <span class="rt">${esc(r.label.slice(0,70))}</span><span class="rtype">${r.type}</span></div>`).join('')).join('');
  box.style.display='block';
}
function pickSearch(i){const r=searchIdx[i];document.getElementById('search').value='';
  document.getElementById('sresults').style.display='none';r.fn();}
document.getElementById('search').addEventListener('input',doSearch);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('search').focus();}
  if(e.key==='Escape')closeModal();});

  'D-Series':'#C9A24B','W-Series':'#6AA9FF','T-Series':'#4ADE80',

function projById(id){ return (DB.projects||[]).find(p=>p.id===id); }

function projectProgress(p){
  const ms = p.milestones||[];
  const tasks = (DB.tasks||[]).filter(t=>t.projectId===p.id);
  const msDone = ms.filter(m=>m.done).length;
  const tDone = tasks.filter(t=>t.done).length;
  const msTotal = ms.length, tTotal = tasks.length;
  if(!msTotal && !tTotal) return 0;
  if(!msTotal) return Math.round(tDone/tTotal*100);
  if(!tTotal) return Math.round(msDone/msTotal*100);
  return Math.round((msDone/msTotal*0.6 + tDone/tTotal*0.4)*100);
}

  return `<div class="row-item" onclick="openTask('${t.id}')">
    <div class="tick ${t.done?'done':''}" onclick="event.stopPropagation();toggleTask('${t.id}')">${t.done?'✓':''}</div>
    ${t.urgent?'<span style="color:var(--warn);font-size:12px">⚡</span>':''}
    <div class="txt">
      <div class="t" style="${t.done?'text-decoration:line-through;color:var(--ink3)':''}">${esc(t.title)}</div>
      <div class="meta">${esc(t.type)}${t.assignedTo?' · '+esc(t.assignedTo):''}${t.due?' · '+fmtDate(t.due):''}</div>
    </div>
    <span class="pill pill-type" style="font-size:10px">${esc(t.category||'Task')}</span>
  </div>`;
}

function projMilestones(p){
  const ms=p.milestones||[];
  const done=ms.filter(m=>m.done).length;
  const color=PROJECT_COLORS[p.type]||'var(--gold)';
  return `<div style="margin-top:18px">
    <div class="card">
      <div class="card-h"><h3>Milestones — ${done}/${ms.length} done</h3>
        <button class="btn btn-sm btn-gold" onclick="addMilestone('${p.id}')">＋ Add Milestone</button>
      </div>
      <div class="card-b">
        ${ms.length?ms.map((m,i)=>`
          <div class="row-item" style="${m.done?'opacity:.6':''}">
            <div class="tick ${m.done?'done':''}" onclick="toggleMilestone('${p.id}','${m.id}')">${m.done?'✓':''}</div>
            <div class="txt">
              <div class="t" style="${m.done?'text-decoration:line-through':''}">${esc(m.title)}</div>
              ${m.date?`<div class="meta">${fmtDate(m.date)}</div>`:''}
            </div>
            <input type="date" value="${esc(m.date||'')}" style="font-size:11px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:6px;padding:3px 6px" onchange="updMilestone('${p.id}','${m.id}','date',this.value)">
            <button class="btn btn-sm btn-danger" onclick="delMilestone('${p.id}','${m.id}')">✕</button>
          </div>`).join(''):'<div class="empty">No milestones yet.</div>'}
      </div>
    </div>
  </div>`;
}

function projNotes(p){
  const notes=(p.notes||[]).slice().reverse();
  return `<div style="margin-top:18px">
    <div class="card" style="margin-bottom:16px">
      <div class="card-h"><h3>Add Note</h3></div>
      <div style="padding:14px 18px">
        <textarea id="proj_note_input_${p.id}" placeholder="Type a note, update or decision..." style="width:100%;min-height:80px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:10px 12px;resize:vertical;outline:none;font-family:inherit;font-size:14px"></textarea>
        <div style="margin-top:8px;display:flex;justify-content:flex-end">
          <button class="btn btn-gold btn-sm" onclick="addProjNote('${p.id}')">Save Note</button>
        </div>
      </div>
    </div>
    <div class="card"><div class="card-h"><h3>Notes Log</h3></div>
      <div class="card-b">
        ${notes.length?notes.map(n=>`
          <div style="padding:12px 0;border-bottom:1px solid var(--line)">
            <div style="font-size:11px;color:var(--ink3);margin-bottom:5px">${esc(n.author||'Felix')} · ${n.created?new Date(n.created).toLocaleString('en-GB',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}</div>
            <div style="font-size:13.5px;white-space:pre-wrap;line-height:1.5">${esc(n.text)}</div>
          </div>`).join(''):'<div class="empty">No notes yet.</div>'}
      </div>
    </div>
  </div>`;
}


// Track selected drop per project for content tab
const projContentDrop = {};

function projContent(p){
  const color = PROJECT_COLORS[p.type]||'var(--gold)';
  const CS_COLORS = {'Email':'var(--gold2)','Post':'var(--blue)','Story':'var(--purple)','Text':'var(--live)','SMS':'var(--live)','Task':'var(--ink3)'};

  const DROP_SERIES = [
    {label:'Main Drop',   type:'Main Drop'},
    {label:'Weekend Drop',type:'Weekend Drop'},
    {label:'Tech Drop',   type:'Tech Drop'},
    {label:'Vault',       type:'Vault'},
  ];

  // Determine active series — default to linked drop's type, or first series
  const linkedDrop = p.linkedDropId ? dropById(p.linkedDropId) : null;
  const defaultSeries = linkedDrop ? linkedDrop.type : 'Main Drop';
  const activeSeries = projContentDrop[p.id+'_series'] || defaultSeries;

  // All drops of selected series type, sorted most recent first
  const seriesDrops = DB.drops
    .filter(d=>d.type===activeSeries)
    .sort((a,b)=>(b.draw||'').localeCompare(a.draw||''));

  // Selected drop within that series — default to linked drop if it matches, else first
  const defaultDropId = (linkedDrop&&linkedDrop.type===activeSeries) ? linkedDrop.id : (seriesDrops[0]?seriesDrops[0].id:'');
  const activeDropId = projContentDrop[p.id+'_drop'] && seriesDrops.find(d=>d.id===projContentDrop[p.id+'_drop']) 
    ? projContentDrop[p.id+'_drop'] : defaultDropId;

  const d = activeDropId ? dropById(activeDropId) : null;

  // Content schedule for selected drop
  const checklist = d ? (d.contentChecklist||[]) : [];
  const byDate = {};
  checklist.forEach(item=>{ (byDate[item.date]=byDate[item.date]||[]).push(item); });
  const dates = Object.keys(byDate).sort();
  const done = checklist.filter(i=>i.done).length;
  const total = checklist.length;
  const pct = total ? Math.round(done/total*100) : 0;
  const contentItems = d ? (DB.content||[]).filter(c=>c.dropId===d.id) : [];

  return `<div style="margin-top:18px">
    <!-- Series selector -->
    <div class="card" style="margin-bottom:16px">
      <div class="modal-b" style="max-height:none;padding:14px 18px">
        <div style="display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap">
          <div style="flex:0 0 auto">
            <div style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Series</div>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              ${DROP_SERIES.map(s=>`<button class="btn btn-sm ${activeSeries===s.type?'btn-gold':''}" onclick="setProjContentSeries('${p.id}','${s.type}')">${s.label}</button>`).join('')}
            </div>
          </div>
          <div style="flex:1;min-width:160px">
            <div style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:8px">Drop</div>
            ${seriesDrops.length
              ? `<select onchange="setProjContentDrop('${p.id}',this.value)" style="width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:13px">
                  ${seriesDrops.map(dr=>`<option value="${dr.id}" ${dr.id===activeDropId?'selected':''}>${esc(dr.number)} — ${esc(watchName(dr.watchId))} · ${fmtDate(dr.draw)}</option>`).join('')}
                </select>`
              : `<div class="muted" style="font-size:13px">No ${activeSeries} drops yet.</div>`}
          </div>
          ${d?`<div style="text-align:right;flex:0 0 auto">
            <div style="font-size:10px;color:var(--ink3);margin-bottom:4px">Content done</div>
            <div style="font-size:22px;font-weight:800;color:${color}">${pct}%</div>
            <div class="muted" style="font-size:11px">${done}/${total}</div>
          </div>`:''}
        </div>
        ${d?`<div style="height:5px;background:var(--line);border-radius:3px;margin-top:12px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:${color};border-radius:3px;transition:width .4s ease"></div>
        </div>`:''}
      </div>
    </div>

    <!-- Content schedule -->
    ${d ? `
    <div style="margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:600">Content Schedule — ${esc(d.number)}</div>
    ${dates.length ? `<div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;margin-bottom:20px">
      ${dates.map(dt=>{
        const dayName=new Date(dt+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
        const isToday=dt===today();
        const isPast=dt<today();
        const dayItems=byDate[dt].sort((a,b)=>a.time.localeCompare(b.time));
        const dayDone=dayItems.filter(i=>i.done).length;
        return `<div style="min-width:200px;flex:0 0 auto;background:var(--panel);border:1px solid ${isToday?color:'var(--line)'};border-radius:var(--radius);padding:12px 14px;${isPast&&dayDone<dayItems.length?'opacity:.7':''}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
            <div style="font-weight:700;font-size:12.5px">${dayName}${isToday?' <span style="color:'+color+';font-size:10px">TODAY</span>':''}</div>
            <span style="font-size:10px;color:var(--ink3)">${dayDone}/${dayItems.length}</span>
          </div>
          ${dayItems.map(item=>`
            <div style="display:flex;gap:8px;align-items:flex-start;padding:5px 0;border-top:1px solid var(--line)">
              <div class="tick ${item.done?'done':''}" style="margin-top:1px;flex-shrink:0" onclick="toggleContentItem('${d.id}','${item.id}')">${item.done?'✓':''}</div>
              <div style="flex:1;min-width:0">
                <div style="font-size:12px;${item.done?'text-decoration:line-through;color:var(--ink3)':''}">${esc(item.title)}</div>
                <div style="font-size:10.5px;color:var(--ink3)">${item.time} · <span style="color:${CS_COLORS[item.channel]||'var(--ink3)'}">${item.channel}</span></div>
              </div>
            </div>`).join('')}
        </div>`;
      }).join('')}
    </div>` : `<div class="card" style="margin-bottom:20px"><div class="empty">No content schedule for ${esc(d.number)} yet.</div></div>`}

    <!-- Content items -->
    <div style="margin-bottom:6px;font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);font-weight:600">Content Items</div>
    <div class="card">
      <div class="card-h"><h3>Linked to ${esc(d.number)}</h3>
        <span class="link" onclick="go('drop','${d.id}','content')" style="font-size:12.5px">Open in Drop Hub →</span>
      </div>
      <div class="card-b">
        ${contentItems.length ? contentItems.map(c=>`
          <div class="row-item" onclick="openContent('${c.id}')">
            <div class="txt"><div class="t">${esc(c.title)}</div>
            <div class="meta">${esc(c.category)}${c.filmDate?' · film '+fmtDate(c.filmDate):''}</div></div>
            <span class="pill pill-draft">${c.status}</span>
          </div>`).join('')
        : `<div class="empty">No content items linked to ${esc(d.number)} yet. <span class="link" onclick="go('content')">Add content →</span></div>`}
      </div>
    </div>` : ''}
  </div>`;
}

function setProjContentSeries(projId, seriesType){
  projContentDrop[projId+'_series'] = seriesType;
  projContentDrop[projId+'_drop'] = ''; // reset drop selection when series changes
  render();
}
function setProjContentDrop(projId, dropId){
  projContentDrop[projId+'_drop'] = dropId;
  render();
}
/* Project CRUD */
function newProject(){
  const p={id:uid('proj'),name:'New Project',type:'Other',status:'Planning',owner:teamList()[0],startDate:today(),targetDate:'',description:'',milestones:[],notes:[],linkedDropId:'',created:now()};
  DB.projects=DB.projects||[];
  DB.projects.unshift(p);
  saveDB();
  go('project',p.id,'overview');
}

function updProj(id,field,val){
  const p=projById(id); if(!p) return;
  p[field]=val; queueSave(); render();
}

function delProject(id){
  if(!confirm('Delete this project? Tasks will remain but lose the project link.')) return;
  DB.projects=(DB.projects||[]).filter(p=>p.id!==id);
  DB.tasks.forEach(t=>{ if(t.projectId===id) t.projectId=''; });
  saveDB(); go('projects');
}

function newProjectTask(projId){
  const t={id:uid('t'),title:'New task',dropId:'',projectId:projId,due:today(),done:false,category:'Task',type:'Drops',assignedTo:teamList()[0],time:'',urgent:false,personRef:'',notes:'',file:'',repeat:'None',created:now()};
  DB.tasks.unshift(t); saveDB(); openTask(t.id);
}

function addMilestone(projId){
  const title=prompt('Milestone name:'); if(!title||!title.trim()) return;
  const p=projById(projId); if(!p) return;
  p.milestones=p.milestones||[];
  p.milestones.push({id:uid('ms'),title:title.trim(),date:'',done:false,created:now()});
  saveDB(); render();
}

function toggleMilestone(projId,msId){
  const p=projById(projId); if(!p) return;
  const m=(p.milestones||[]).find(x=>x.id===msId); if(!m) return;
  m.done=!m.done; queueSave(); render();
}

function updMilestone(projId,msId,field,val){
  const p=projById(projId); if(!p) return;
  const m=(p.milestones||[]).find(x=>x.id===msId); if(!m) return;
  m[field]=val; queueSave();
}

function delMilestone(projId,msId){
  const p=projById(projId); if(!p) return;
  p.milestones=(p.milestones||[]).filter(x=>x.id!==msId);
  saveDB(); render();
}

function addProjNote(projId){
  const inp=document.getElementById('proj_note_input_'+projId);
  if(!inp||!inp.value.trim()) return;
  const p=projById(projId); if(!p) return;
  p.notes=p.notes||[];
  p.notes.push({id:uid('note'),text:inp.value.trim(),author:DB.settings&&DB.settings.team?DB.settings.team[0]:'Felix',created:now()});
  inp.value='';
  saveDB(); render();
}

function linkDropToProject(dropId){
  const projects = DB.projects||[];
  if(!projects.length){ if(confirm('No projects yet. Create one now?')) newProject(); return; }
  // Simple select via prompt — list project names
  const names = projects.map((p,i)=>`${i+1}. ${p.name}`).join('\n');
  const choice = prompt(`Link to which project?\n\n${names}\n\nEnter number:`);
  if(!choice) return;
  const idx = parseInt(choice)-1;
  if(isNaN(idx)||idx<0||idx>=projects.length) return;
  projects[idx].linkedDropId = dropId;
  saveDB(); render();
}

checkSessionAndBoot();
</script>
