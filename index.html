<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0B1220; --bg2:#0E1626; --panel:#111C30; --panel2:#152238;
    --line:#1E2C44; --line2:#28395A;
    --ink:#E8EDF6; --ink2:#AEBBD2; --ink3:#7688A8;
    --gold:#C9A24B; --gold2:#E4C879; --goldsoft:rgba(201,162,75,.14);
    --live:#4ADE80; --live-bg:rgba(74,222,128,.12);
    --warn:#F5A524; --danger:#F26D6D; --blue:#6AA9FF; --purple:#C86DD7;
    --radius:12px; --radius-sm:8px;
    --shadow:0 8px 28px rgba(0,0,0,.42);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  html[data-theme="light"]{
    --bg:#F4F6FA; --bg2:#FFFFFF; --panel:#FFFFFF; --panel2:#F1F4F9;
    --line:#E3E8F0; --line2:#CDD5E3;
    --ink:#0F2B5B; --ink2:#4A5A78; --ink3:#8090A8;
    --gold:#C9A24B; --gold2:#9C7A2E; --goldsoft:rgba(201,162,75,.12);
    --live:#15803D; --live-bg:rgba(21,128,61,.10);
    --warn:#B45309; --danger:#DC2626; --blue:#2563EB; --purple:#9333EA;
    --shadow:0 8px 28px rgba(15,23,42,.10);
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px}
  a{color:var(--gold2);text-decoration:none}

  #app{display:flex;height:100vh}
  .sidebar{width:236px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8f6f28);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0B1220;font-size:17px}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:10px;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
  .nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
  .nav-group{margin-top:14px}
  .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink3);
    padding:6px 10px 4px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
    color:var(--ink2);font-weight:500;font-size:13.5px;cursor:pointer;transition:.12s;position:relative}
  .nav-item:hover{background:var(--panel);color:var(--ink)}
  .nav-item.active{background:var(--goldsoft);color:var(--gold2)}
  .nav-item .ico{width:17px;text-align:center;font-size:15px;flex-shrink:0}
  .nav-item .badge{margin-left:auto;background:var(--line2);color:var(--ink2);font-size:10.5px;
    padding:1px 7px;border-radius:20px;font-weight:600}
  .nav-item.active .badge{background:var(--gold);color:#0B1220}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:14px;padding:0 22px;flex-shrink:0;background:var(--bg)}
  .search-wrap{flex:1;max-width:520px;position:relative}
  .search-wrap input{width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 14px 9px 38px;outline:none;transition:.15s}
  .search-wrap input:focus{border-color:var(--gold);background:var(--panel2)}
  .search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:9px 15px;
    border-radius:9px;font-weight:600;font-size:13px;transition:.13s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel2);border-color:var(--gold)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#a9852f);color:#0B1220;border:none}
  .btn-gold:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));border:none}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .btn-ghost{background:transparent;border:1px solid var(--line2)}
  .btn-danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn-danger:hover{background:rgba(242,109,109,.1);border-color:transparent}

  .content{flex:1;overflow-y:auto;padding:26px 30px 60px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  .page-head h2{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .page-head .desc{color:var(--ink3);font-size:13px;margin-top:3px}
  .page-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:18px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:600}
  .kpi .val{font-size:26px;font-weight:800;margin-top:7px;letter-spacing:-.5px}
  .kpi .val.gold{color:var(--gold2)}
  .kpi .val.green{color:var(--live)}
  .kpi .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .kpi-row.condensed{margin-bottom:18px}
  .kpi-row.condensed .kpi{padding:11px 14px}
  .kpi-row.condensed .val{font-size:19px;margin-top:3px}
  .kpi-row.condensed .sub{font-size:11px}
  .calc-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
  .calc-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  .calc-row span:first-child{color:var(--ink2)}
  .calc-row span:last-child{font-weight:700;color:var(--ink)}
  @media(max-width:760px){.calc-grid{grid-template-columns:1fr}}
  .cost-breakdown{margin-top:9px;padding-top:8px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:3px}
  .cb-row{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink3)}
  .cb-row span:last-child{color:var(--ink2);font-weight:600}
  .bar-chart{display:flex;align-items:flex-end;gap:10px;height:150px;padding:10px 4px 0}
  .bar-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}
  .bar-fill{width:60%;background:linear-gradient(180deg,var(--gold),var(--gold2));border-radius:4px 4px 0 0;min-height:2px}
  .bar-fill.blue{background:linear-gradient(180deg,var(--blue),#4d86d9)}
  .bar-val{font-size:10.5px;color:var(--ink2);margin-bottom:4px;font-weight:700;white-space:nowrap}
  .bar-label{font-size:10px;color:var(--ink3);margin-top:6px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}

  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card-h h3{font-size:14px;font-weight:700}
  .card-h .link{font-size:12px;color:var(--ink3);cursor:pointer}
  .card-h .link:hover{color:var(--gold2)}
  .card-b{padding:8px 0}
  .empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:13px}
  .empty button{color:var(--gold2);font-weight:600;margin-top:8px}

  .row-item{padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:.1s}
  .row-item:last-child{border-bottom:none}
  .row-item:hover{background:var(--panel2)}
  .row-item .tick{width:17px;height:17px;border:1.7px solid var(--line2);border-radius:5px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.12s}
  .row-item .tick:hover{border-color:var(--gold)}
  .row-item .tick.done{background:var(--gold);border-color:var(--gold);color:#0B1220;font-size:11px;font-weight:800}
  .row-item .txt{flex:1;min-width:0}
  .row-item .txt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-item .txt.done .t{text-decoration:line-through;color:var(--ink3)}
  .row-item .meta{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .pill{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .pill-live{background:var(--live-bg);color:var(--live)}
  .pill-draft{background:var(--line2);color:var(--ink2)}
  .pill-upcoming{background:rgba(106,169,255,.13);color:var(--blue)}
  .pill-done{background:var(--goldsoft);color:var(--gold2)}
  .pill-closed{background:rgba(242,109,109,.12);color:var(--danger)}
  .pill-type{background:var(--panel2);color:var(--ink2);border:1px solid var(--line2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:.14s}
  .gcard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
  .gcard .thumb{height:120px;background:linear-gradient(135deg,var(--panel2),var(--bg2));
    display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--line2);position:relative;overflow:hidden}
  .gcard .thumb img{width:100%;height:100%;object-fit:cover}
  .gcard .gbody{padding:13px 15px}
  .gcard .gtitle{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcard .gsub{font-size:12px;color:var(--ink3);margin-top:3px}
  .gcard .gmeta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
    font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .tbl tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--panel2)}
  .tbl .strong{font-weight:600}

  .hub-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .hub-head .htitle h2{font-size:26px;font-weight:800}
  .hub-head .hmeta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
  .tab{padding:10px 15px;color:var(--ink3);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;
    white-space:nowrap;transition:.12s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--ink3);font-weight:600;margin-bottom:6px}
  .field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);
    color:var(--ink);border-radius:8px;padding:9px 12px;outline:none;transition:.13s}
  .field input:focus,.field textarea:focus{border-color:var(--gold);background:var(--panel)}
  .field textarea{resize:vertical;min-height:80px;line-height:1.5}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  .field-wrap{display:flex;flex-wrap:wrap;gap:14px 18px}
  .field-compact{width:118px;flex-shrink:0}
  .field-compact label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;
    color:var(--ink3);font-weight:600;margin-bottom:6px;line-height:1.3;white-space:normal}
  .field-compact input{width:100%;background:var(--bg2);border:1px solid var(--line2);
    color:var(--ink);border-radius:8px;padding:8px 9px;outline:none;transition:.13s;font-size:13.5px}
  .field-compact input:focus{border-color:var(--gold);background:var(--panel)}
  .field-compact input:disabled{opacity:.65}

  .timeline{position:relative;padding-left:22px}
  .timeline:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line2)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
  .tl-item .tl-t{font-weight:600;font-size:13.5px}
  .tl-item .tl-d{font-size:11.5px;color:var(--ink3);margin-top:1px}

  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(3px);
    z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto}
  .modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;
    box-shadow:var(--shadow);animation:pop .18s ease}
  .modal.wide{max-width:760px}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:17px;font-weight:800}
  .modal-h .x{color:var(--ink3);font-size:22px;line-height:1;cursor:pointer;padding:4px}
  .modal-h .x:hover{color:var(--ink)}
  .modal-b{padding:20px 22px;max-height:65vh;overflow-y:auto;position:relative}
  .modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  .sresults{position:absolute;top:46px;left:0;right:0;background:var(--bg2);border:1px solid var(--line2);
    border-radius:11px;box-shadow:var(--shadow);z-index:60;max-height:60vh;overflow-y:auto;padding:6px;display:none}
  .sresult-group{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);
    padding:9px 12px 4px;font-weight:700}
  .sresult{padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:11px;cursor:pointer}
  .sresult:hover{background:var(--panel)}
  .sresult .ri{width:16px;text-align:center;color:var(--gold)}
  .sresult .rt{font-weight:500;flex:1}
  .sresult .rtype{font-size:11px;color:var(--ink3)}

  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .fbtn{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel);
    border:1px solid var(--line);color:var(--ink2)}
  .fbtn:hover{border-color:var(--line2)}
  .fbtn.active{background:var(--goldsoft);color:var(--gold2);border-color:var(--gold)}

  .asset-tile{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--panel2);
    border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--line2)}
  .asset-tile img,.asset-tile video{width:100%;height:100%;object-fit:cover}
  .asset-tile .atag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));
    padding:14px 8px 6px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset-dl{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;background:rgba(11,18,32,.75);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;backdrop-filter:blur(2px)}
  .asset-dl:hover{background:var(--gold);color:#0B1220}
  .asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--gold);color:var(--ink);padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);
    z-index:200;font-weight:600;font-size:13px;animation:pop .2s}

  .divider{height:1px;background:var(--line);margin:22px 0}
  .muted{color:var(--ink3)}
  .mono{font-variant-numeric:tabular-nums}
  .add-inline{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;align-items:center}
  .add-inline input{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:8px 12px;outline:none}
  .add-inline input:focus{border-color:var(--gold)}
  .add-inline .dd{min-width:150px}
  .loading{padding:60px;text-align:center;color:var(--ink3)}
  .section-sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);
    font-weight:700;margin:20px 0 12px}
  .kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
  .kcol{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .kcol-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);
    margin-bottom:10px;display:flex;justify-content:space-between}
  .kcard{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
  .kcard:hover{border-color:var(--gold)}
  .kcard .kt{font-weight:600;font-size:13px}
  .kcard .km{font-size:11px;color:var(--ink3);margin-top:4px}

  .dd{position:relative}
  .dd-btn{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dd-btn:hover{border-color:var(--gold)}
  .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-car{color:var(--ink3);font-size:10px;flex-shrink:0}
  .dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);
    border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);z-index:90;max-height:230px;overflow-y:auto;padding:4px}
  .dd-menu.open{display:block}
  .dd-opt{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13.5px}
  .dd-opt:hover{background:var(--panel)}
  .dd-opt.sel{color:var(--gold2);font-weight:600}

  .media-box{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px}
  .media-row{display:flex;gap:8px}
  .media-row input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;color:var(--ink);outline:none}
  .media-row input:focus{border-color:var(--gold)}
  .media-upload{white-space:nowrap;cursor:pointer}
  .media-prev{width:100%;max-height:130px;object-fit:cover;border-radius:7px;margin-bottom:8px;display:block}
  .gallery-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-bottom:8px}
  .gallery-item{position:relative;background:var(--bg2);border:1px solid var(--line2);border-radius:7px;overflow:hidden;height:80px}
  .gallery-item img,.gallery-item video{width:100%;height:100%;object-fit:cover;display:block}
  .gallery-remove{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(11,18,32,.85);
    color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;line-height:1;z-index:2}
  .gallery-remove:hover{background:var(--danger);color:#fff}
  .gallery-uploading{display:flex;align-items:center;justify-content:center;color:var(--ink2);font-size:12px;font-weight:600}
  .gallery-link-item{display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;color:var(--ink2);font-size:10px;padding:6px;text-align:center;word-break:break-all}
  .gallery-link-item span.ico{font-size:20px}

    .presence-avatar{width:26px;height:26px;border-radius:50%;background:var(--panel2);border:2px solid var(--bg2);

      margin-left:-8px;flex-shrink:0}

    .presence-extra{font-size:11px;color:var(--ink3);margin-left:6px;font-weight:600}
    @media(max-width:860px){ .presence-bar{padding:6px} }
    @keyframes syncPulse{0%,100%{opacity:1}50%{opacity:.35}}

    #themeToggleBtn{
      width:40px;
      height:40px;
      padding:0;

      overflow:hidden;
      white-space:nowrap;
    }

      line-height:1;

    .content{
      padding:16px 12px 84px;

    }

      align-items:flex-start;

    }
    .page-head h2,.hub-head .htitle h2{

    }

    .cal-grid,.cal-grid-head{gap:4px}

  }

  @media(max-width:420px){
    .kpi-row{grid-template-columns:1fr}

  /* ================= Graphics Generator ================= */
  #ggRoot{display:flex;gap:18px;height:calc(100vh - 240px);min-height:520px}
  #ggControls{width:344px;flex-shrink:0;overflow-y:auto;padding-right:8px}
  #ggPreview{flex:1;display:flex;align-items:center;justify-content:center;overflow:auto;min-width:0;
    background:radial-gradient(120% 120% at 50% 0%,#101a2e,#0B1220);border:1px solid var(--line);border-radius:12px}
  #ggFrame{position:relative;box-shadow:0 24px 70px rgba(0,0,0,.5);border-radius:4px;overflow:hidden}
  #ggRoot .gg-group{border-bottom:1px solid var(--line);padding:14px 0}
  #ggRoot .gg-group:first-child{padding-top:2px}
  #ggRoot .gg-group:last-child{border-bottom:none}
  #ggRoot .gg-title{font-size:10.5px;text-transform:uppercase;letter-spacing:1.1px;color:var(--gold2);font-weight:700;margin-bottom:11px}
  #ggRoot .gg-fld{margin-bottom:10px}
  #ggRoot .gg-fld:last-child{margin-bottom:0}
  #ggRoot .gg-fld label{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--ink3);font-weight:600;margin-bottom:5px}
  #ggRoot .gg-fld input[type=text],#ggRoot .gg-fld textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:8px 10px;outline:none}
  #ggRoot .gg-fld input[type=text]:focus,#ggRoot .gg-fld textarea:focus{border-color:var(--gold)}
  #ggRoot .gg-fld input[type=range]{width:100%;accent-color:var(--gold)}
  #ggRoot .gg-row{display:flex;gap:8px}
  #ggRoot .gg-row .gg-fld{flex:1}
  #ggRoot .gg-rv{float:right;color:var(--ink2);font-weight:600;font-variant-numeric:tabular-nums}
  #ggRoot .gg-chips{display:flex;gap:6px;flex-wrap:wrap}
  #ggRoot .gg-chip{padding:6px 11px;border-radius:8px;background:var(--bg2);border:1px solid var(--line2);font-size:12px;font-weight:600;cursor:pointer;color:var(--ink2)}
  #ggRoot .gg-chip.active{background:var(--goldsoft);border-color:var(--gold);color:var(--gold2)}
  #ggRoot .gg-up{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;border:1.5px dashed var(--line2);border-radius:10px;background:var(--bg2);cursor:pointer;font-weight:600;color:var(--ink2)}
  #ggRoot .gg-up:hover{border-color:var(--gold);color:var(--gold2)}
  #ggRoot .gg-sw{display:flex;gap:7px}
  #ggRoot .gg-swatch{width:28px;height:28px;border-radius:7px;cursor:pointer;border:2px solid transparent}
  #ggRoot .gg-swatch.active{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
  #ggRoot .gg-toggle{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
  #ggRoot .gg-toggle input{display:none}
  #ggRoot .gg-switch{width:36px;height:21px;border-radius:20px;background:var(--line2);position:relative;transition:.15s;flex-shrink:0}
  #ggRoot .gg-switch:after{content:'';position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s}
  #ggRoot .gg-toggle input:checked + .gg-switch{background:var(--gold)}
  #ggRoot .gg-toggle input:checked + .gg-switch:after{transform:translateX(15px)}
  #ggRoot .gg-tl{font-size:12.5px;font-weight:600;color:var(--ink)}
  #ggRoot .gg-dlrow{display:flex;gap:10px;align-items:center;margin-top:14px}
  #ggRoot .gg-dl{flex:1;background:linear-gradient(135deg,var(--gold),#a9852f);color:#0B1220;border:none;padding:11px;border-radius:10px;font-weight:700;cursor:pointer}
  #ggRoot .gg-dl:hover{background:linear-gradient(135deg,var(--gold2),var(--gold))}
  #ggRoot .gg-dl:disabled{opacity:.6;cursor:wait}
  #ggRoot .gg-q{width:70px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:9px;padding:10px 6px;outline:none}
  #ggRoot .gg-hint{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.4}

  #ggCard{position:absolute;top:0;left:0;transform-origin:top left;overflow:hidden;color:#fff;font-family:'Oswald',sans-serif;

  #ggCard .pricebox{display:inline-flex;align-items:center;background:rgba(16,26,44,.72);border:1px solid rgba(255,255,255,.10);font-family:'Montserrat';font-weight:700}

<script>
/* ============================================================
   ATLAS — The Watch Drop internal OS (live / multi-user build)
   Backed by Supabase for storage + login (multi-user, persistent)
   ============================================================ */

/* ---------- Supabase config ---------- */
/* NOTE: our client is named "sb", not "supabase" — the Supabase library
   itself creates a global called "supabase" when it loads from the CDN,
   so naming our own variable the same thing causes the whole script to
   fail to parse (duplicate global declaration). */
const SUPABASE_URL = 'https://dkhvgzqfograzcrhsedz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WCJwO2il8A3sXFpamAxOQQ_uJXOmDOp';
let sb = null;
let supabaseLoadError = '';
try{
  if(!window.supabase) throw new Error('Supabase library did not load');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){
  console.error('Supabase failed to initialise:', e);
  supabaseLoadError = 'Login system failed to load. This is usually an ad blocker or network filter blocking cdn.jsdelivr.net — try disabling any ad blocker for this page, or try a different network/browser, then refresh.';
}
function showLoginErr(msg){
  const el=document.getElementById('loginErr'); if(el) el.textContent=msg;
  const scr=document.getElementById('loginScreen'); if(scr) scr.style.display='flex';
}

/* ---------- Storage wrapper (same shape as window.storage, backed by a Supabase table) ---------- */
/* Safety net: tracks whether saves are truly reaching the cloud (vs falling back to
   this device only), keeps the last 10 cloud versions so an overwrite can be rolled
   back, and warns before saving if the cloud has moved on since we last loaded
   (i.e. someone else — or another device — saved after us). */
let lastKnownCloudUpdatedAt = null;
let cloudReachable = null; // true/false/null(unknown)

function setSyncStatus(mode, detail){
  const el = document.getElementById('syncStatus'); if(!el) return;
  el.classList.remove('sync-ok','sync-local','sync-unknown');
  const label = el.querySelector('.sync-label');
  if(mode==='ok'){ el.classList.add('sync-ok'); if(label) label.textContent = 'Synced'+(detail?' · '+detail:''); }
  else if(mode==='local'){ el.classList.add('sync-local'); if(label) label.textContent = 'This device only'; }
  else { el.classList.add('sync-unknown'); if(label) label.textContent = detail || 'Checking…'; }
}
function showSyncDetails(){
  openVersionHistory();
}
async function openVersionHistory(){
  if(!sb){ toast('No cloud connection available.'); return; }
  const statusLine = cloudReachable===true
    ? `<div class="muted" style="margin-bottom:12px">🟢 Synced to the shared cloud database. Last save: ${lastKnownCloudUpdatedAt? new Date(lastKnownCloudUpdatedAt).toLocaleString('en-GB') : 'unknown'}</div>`
    : cloudReachable===false
      ? `<div class="muted" style="margin-bottom:12px;color:var(--warn)">⚠ Not reaching the cloud right now — changes are only saved on this device until connection is restored.</div>`
      : `<div class="muted" style="margin-bottom:12px">Checking connection…</div>`;
  openModal(`<div class="modal"><div class="modal-h"><h3>☁️ Sync &amp; Backups</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">
      ${statusLine}
      <div class="section-sub" style="margin-bottom:8px">Recent saved versions</div>
      <div id="versionList" class="muted">Loading…</div>
    </div></div>`);
  try{
    const { data: versions, error } = await sb.from('atlas_kv').select('key, updated_at').like('key', K+':v:%').order('updated_at', { ascending:false });
    const list = document.getElementById('versionList'); if(!list) return;
    if(error || !versions || !versions.length){ list.textContent='No backup versions yet — one is saved automatically every time changes are saved to the cloud.'; return; }
    list.innerHTML = versions.map(v=>{
      const d = new Date(v.updated_at);
      return `<div class="row-item"><div class="txt"><div class="t">${d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})}</div><div class="meta">${d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</div></div>
        <button class="btn btn-sm" onclick="restoreVersion('${v.key}')">Restore this version</button></div>`;
    }).join('');
  }catch(e){
    const list = document.getElementById('versionList'); if(list) list.textContent='Could not load version history.';
  }
}
async function restoreVersion(versionKey){
  if(!confirm('This will replace your CURRENT data with this saved version. Your current data will itself be backed up first, so nothing is lost. Continue?')) return;
  try{
    // Back up current state before restoring, so restoring is itself reversible.
    const { data: currentRow } = await sb.from('atlas_kv').select('value').eq('key', K).maybeSingle();
    if(currentRow){
      await sb.from('atlas_kv').upsert({ key: K+':v:'+new Date().toISOString()+':pre-restore', value: currentRow.value, updated_at: new Date().toISOString() });
    }
    const { data: versionRow, error } = await sb.from('atlas_kv').select('value').eq('key', versionKey).maybeSingle();
    if(error || !versionRow){ toast('Could not load that version.'); return; }
    await dbStorage.set(K, versionRow.value);
    DB = JSON.parse(versionRow.value);
    migrate(); closeModal(); toast('Version restored ✅'); render();
  }catch(e){ toast('Restore failed — see console for details.'); console.error(e); }
}

const dbStorage = {
  async get(key){
    // Try Supabase first, fall back to localStorage
    if(sb){
      try{
        const { data, error } = await sb.from('atlas_kv').select('value, updated_at').eq('key', key).maybeSingle();
        if(!error && data){
          cloudReachable = true;
          lastKnownCloudUpdatedAt = data.updated_at || new Date().toISOString();
          setSyncStatus('ok', 'loaded');
          return { key, value: data.value };
        }
        if(error){ console.warn('Supabase get failed, using localStorage', error.message); cloudReachable=false; setSyncStatus('local'); }
      }catch(e){ console.warn('Supabase get error, using localStorage'); cloudReachable=false; setSyncStatus('local'); }
    }
    const local = localStorage.getItem(key);
    return local ? { key, value: local } : null;
  },
  async set(key, value){
    // Always save to localStorage immediately (instant, no auth needed)
    try{ localStorage.setItem(key, value); }catch(e){}
    if(!sb){ setSyncStatus('local'); return { key, value }; }

    try{
      // Safety check: has the cloud moved on since we last loaded? (another
      // device/person saved after us). If so, don't silently overwrite —
      // stash a backup of what's up there right now under a rescue key first.
      const { data: current } = await sb.from('atlas_kv').select('updated_at, value').eq('key', key).maybeSingle();
      if(current && lastKnownCloudUpdatedAt && current.updated_at && new Date(current.updated_at) > new Date(lastKnownCloudUpdatedAt) && current.value !== value){
        const rescueKey = key+':conflict:'+Date.now();
        try{ await sb.from('atlas_kv').upsert({ key: rescueKey, value: current.value, updated_at: new Date().toISOString() }); }catch(e){}
        console.warn('Cloud data had changed since last load — saved a safety copy under', rescueKey, 'before overwriting.');
      }

      const nowIso = new Date().toISOString();
      const { error } = await sb.from('atlas_kv').upsert({ key, value, updated_at: nowIso });
      if(error){ console.warn('Supabase save failed (local save OK)', error.message); cloudReachable=false; setSyncStatus('local'); return { key, value }; }

      cloudReachable = true; lastKnownCloudUpdatedAt = nowIso;
      setSyncStatus('ok', new Date(nowIso).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}));

      // Keep a rolling set of the last 10 versions so any bad save can be rolled back.
      try{
        const verKey = key+':v:'+nowIso;
        await sb.from('atlas_kv').upsert({ key: verKey, value, updated_at: nowIso });
        const { data: versions } = await sb.from('atlas_kv').select('key, updated_at').like('key', key+':v:%').order('updated_at', { ascending:false });
        if(versions && versions.length > 10){
          const toDelete = versions.slice(10).map(v=>v.key);
          if(toDelete.length) await sb.from('atlas_kv').delete().in('key', toDelete);
        }
      }catch(e){ console.warn('Version backup skipped', e); }
    }catch(e){
      console.warn('Supabase save error (local save OK)', e);
      cloudReachable=false; setSyncStatus('local');
    }
    return { key, value };
  }
};


/* ---------- Auth ---------- */
async function doSignIn(){
  if(!sb){ showLoginErr(supabaseLoadError); return; }
  const email=document.getElementById('loginEmail').value.trim();
  const password=document.getElementById('loginPassword').value;
  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!email || !password){ errEl.textContent='Enter both email and password.'; return; }
  const btn=document.getElementById('loginBtn'); btn.textContent='Signing in…';
  let result;
  try{ result = await sb.auth.signInWithPassword({ email, password }); }
  catch(e){ btn.textContent='Sign in'; errEl.textContent='Network error reaching Supabase — check your connection and try again.'; return; }
  btn.textContent='Sign in';
  if(result.error){ errEl.textContent = result.error.message || 'Could not sign in — check your email and password.'; return; }
  await bootApp();
}
async function doSignOut(){
  teardownPresence();
  if(sb) await sb.auth.signOut();
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginEmail').value='';
  document.getElementById('loginPassword').value='';
}
async function bootApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='flex';
  await loadDB(); migrate(); applyTheme(); render();
  initPresence();
}

/* ---------- Presence: shows who else is currently in Atlas, live ----------
   Uses Supabase Realtime Presence (a lightweight "who's connected" channel —
   separate from the data table). Each open tab/device tracks itself with a
   random session id, so if the SAME account is open on two devices (the
   exact scenario that caused data loss before), it shows up as 2 present,
   not 1 — that's deliberate. */
let presenceChannel = null;
const PRESENCE_SESSION_ID = 'sess_'+Math.random().toString(36).slice(2,10);
function deviceLabel(){
  const ua = navigator.userAgent;
  if(/iPhone|iPad/.test(ua)) return 'iPhone';
  if(/Android/.test(ua)) return 'Android';
  if(/Macintosh/.test(ua)) return 'Mac';
  if(/Windows/.test(ua)) return 'Windows';
  return 'Device';
}
function initialsFor(email){
  if(!email) return '?';
  const name = email.split('@')[0];
  return name.slice(0,2).toUpperCase();
}
function getPresenceName(){
  return localStorage.getItem('atlas:username')||'';
}
function promptPresenceName(cb){
  const team = (DB&&DB.settings&&DB.settings.team)||['Felix','Leila'];
  openModal(`<div class="modal"><div class="modal-h"><h3>👋 Who are you?</h3></div>
    <div class="modal-b">
      <div class="muted" style="margin-bottom:16px">This is stored on your device so Atlas knows who you are. You only need to do this once.</div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${team.map(name=>`<button class="btn btn-gold" style="flex:1;justify-content:center;padding:14px" onclick="setPresenceName('${name}')">${name}</button>`).join('')}
      </div>
      <div style="margin-top:12px;display:flex;gap:8px">
        <input id="presenceNameInput" placeholder="Or type your name…" style="flex:1;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);border-radius:8px;padding:9px 12px" onkeydown="if(event.key==='Enter'&&this.value.trim())setPresenceName(this.value.trim())">
        <button class="btn" onclick="const v=document.getElementById('presenceNameInput').value.trim();if(v)setPresenceName(v)">Set</button>
      </div>
    </div>
  </div>`);
  window._presenceNameCb = cb;
}
function setPresenceName(name){
  if(!name) return;
  localStorage.setItem('atlas:username', name);
  closeModal();
  if(window._presenceNameCb){ window._presenceNameCb(name); window._presenceNameCb=null; }
  renderPresence();
}
async function initPresence(){
  if(!sb) return;
  try{
    let name = getPresenceName();
    if(!name){
      // Ask once, then start presence after they answer
      promptPresenceName(n=>{ name=n; _startPresenceChannel(name); });
      return;
    }
    _startPresenceChannel(name);
  }catch(e){ console.warn('Presence init failed', e); }
}
async function _startPresenceChannel(name){
  if(!sb) return;
  try{
    presenceChannel = sb.channel('atlas-presence-v1', { config: { presence: { key: PRESENCE_SESSION_ID } } });
    presenceChannel.on('presence', { event: 'sync' }, renderPresence);
    presenceChannel.subscribe(async (status)=>{
      if(status==='SUBSCRIBED'){
        await presenceChannel.track({ name, device: deviceLabel(), online_at: new Date().toISOString() });
      }
    });
    window.addEventListener('beforeunload', teardownPresence);
  }catch(e){ console.warn('Presence channel failed', e); }
}
function teardownPresence(){
  if(presenceChannel){ try{ presenceChannel.untrack(); sb.removeChannel(presenceChannel); }catch(e){} presenceChannel=null; }
}
let lastPresenceState = [];
function renderPresence(){
  if(!presenceChannel) return;
  const state = presenceChannel.presenceState();
  const all = [];
  Object.keys(state).forEach(key=>{
    (state[key]||[]).forEach(p=> all.push({ key, name:p.name||p.email||'?', device:p.device, online_at:p.online_at }));
  });
  lastPresenceState = all;
  const bar = document.getElementById('presenceBar'); if(!bar) return;
  const others = all.filter(p=>p.key!==PRESENCE_SESSION_ID);
  bar.classList.remove('presence-alone','presence-crowded');
  if(all.length<=1) bar.classList.add('presence-alone');
  else bar.classList.add('presence-crowded');

  const shown = all.slice(0,4);
  bar.innerHTML = shown.map(p=>{
    const mine = p.key===PRESENCE_SESSION_ID;
    const name = p.name||'?';
    return `<div style="display:flex;align-items:center;gap:6px;padding:2px 6px 2px 2px;background:${mine?'rgba(201,162,75,.15)':'rgba(34,197,94,.1)'};border-radius:20px;border:1px solid ${mine?'var(--gold)':'var(--live)'}">
      <div class="presence-avatar ${mine?'me':'other'}" style="margin:0;flex-shrink:0" title="${esc(name)}">${name.slice(0,2).toUpperCase()}</div>
      <span style="font-size:12px;font-weight:600;color:${mine?'var(--gold2)':'var(--live)'};white-space:nowrap">${esc(name)}${mine?' (you)':''}</span>
    </div>`;
  }).join('') + (all.length>4? `<span class="presence-extra">+${all.length-4}</span>` : '');

  if(others.length>0) bar.title = `${others.map(p=>p.name).join(', ')} also in Atlas`;
  else bar.title = 'Just you right now';
}
function showPresenceDetails(){
  const myName = getPresenceName();
  const rows = lastPresenceState.length? lastPresenceState.map(p=>{
    const mine = p.key===PRESENCE_SESSION_ID;
    const since = p.online_at? new Date(p.online_at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}) : '';
    return `<div class="row-item"><div class="txt"><div class="t">${esc(p.name||'Unknown')}${mine?' <span style=\"color:var(--gold2);font-size:11px\">(you)</span>':''}</div><div class="meta">${esc(p.device||'')} · online since ${since}</div></div></div>`;
  }).join('') : '<div class="muted">No one else detected right now.</div>';
  const warnLine = lastPresenceState.length>1
    ? `<div class="muted" style="margin-bottom:12px;color:var(--warn)">⚠ More than one session is active. If you're both editing at the same time, whoever saves last will overwrite the other's changes. Best practice right now: only one person in Atlas at a time.</div>`
    : `<div class="muted" style="margin-bottom:12px;color:var(--live)">🟢 You're the only one in Atlas right now — safe to edit.</div>`;
  openModal(`<div class="modal"><div class="modal-h"><h3>👥 Who's here</h3><span class="x" onclick="closeModal()">×</span></div>
    <div class="modal-b">${warnLine}${rows}
      <div style="margin-top:12px;padding-top:12px;border-top:1px solid var(--line)">
        <span class="muted" style="font-size:12px">Signed in as <strong>${esc(getPresenceName()||'Unknown')}</strong></span>
        <button class="btn btn-sm btn-ghost" style="margin-left:10px" onclick="closeModal();localStorage.removeItem('atlas:username');initPresence()">Change name</button>
      </div>
    </div></div>`);
}

function timeAgo(iso){const s=(Date.now()-new Date(iso))/1000;if(s<60)return'just now';if(s<3600)return Math.floor(s/60)+'m ago';if(s<86400)return Math.floor(s/3600)+'h ago';return Math.floor(s/86400)+'d ago';}

function inThisMonth(d){const n=new Date();const m=n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0');return (d.launch||'').slice(0,7)===m||(d.draw||'').slice(0,7)===m;}
function startOfWeekISO(dateStr){
  const d=new Date(dateStr+'T00:00:00');
  const day=d.getDay(); // 0=Sun..6=Sat
  const diff = (day===0? -6 : 1-day); // shift back to Monday
  d.setDate(d.getDate()+diff);
  return localISODate(d);
}
function inThisWeek(d){
  const ws=startOfWeekISO(today()), we=addDays(ws,6);
  const chk=dt=> dt && dt>=ws && dt<=we;
  return chk(d.launch)||chk(d.draw);
}

/* ---------- Migration: fills in new fields on existing saved data ---------- */
/* Ensures a single drop has a fully-formed tracker + all supporting fields.
   Called for every drop on boot (via migrate) AND immediately when a new drop
   is created, so the Drop Tracker / Overview always have something to write to. */
function migrateDrop(d){
  d.websiteLink=d.websiteLink||'';
  d.dropId=d.dropId||'';
  d.scripts=d.scripts||[];
  d.ads=d.ads||[];
  d.discountPrice=d.discountPrice||0;
  d.discountEntriesSold=d.discountEntriesSold||0;
  d.copy=d.copy||{};
  d.copy.headline=d.copy.headline||'';
  d.copy.body=d.copy.body||'';
  d.copy.seoKeyphrase=d.copy.seoKeyphrase||'';
  d.copy.seoTitle=d.copy.seoTitle||'';
  d.copy.slug=d.copy.slug||'';
  d.copy.metaDescription=d.copy.metaDescription||'';
  d.images=d.images||{main:'',cat1:'',cat2:'',cat3:'',webHero:'',phoneHero:''};
  d.entrants=d.entrants||{filename:'',headers:[],rows:[]};
  d.perf=d.perf||{};
  d.marketing=d.marketing||[];
  d.links=d.links||{};
  if(d.costWatch===undefined){
    // migrating from the old flat "cost" field — park it under Fixed Costs so
    // existing profit totals don't change until reconciled manually
    d.costWatch=0;
    d.costFixed=Number(d.cost)||0;
    d.variableCosts=d.variableCosts||[];
  }
  d.variableCosts=d.variableCosts||[];
  d.tracker=d.tracker||{};
  const t=d.tracker;
  t.statedValue=t.statedValue||0;
  t.watchCost=t.watchCost!==undefined?t.watchCost:(Number(d.costWatch)||0);
  t.maxTickets=t.maxTickets!==undefined?t.maxTickets:(Number(d.pool)||0);
  t.fullTicketPrice=t.fullTicketPrice!==undefined?t.fullTicketPrice:(Number(d.price)||0);
  t.launchDiscountPct=t.launchDiscountPct||0;
  t.compLifeDiscountPct=t.compLifeDiscountPct||0;
  t.adsBudget=t.adsBudget||0;
  t.fixed=t.fixed!==undefined?t.fixed:(Number(d.costFixed)||0);
  t.instantWins=t.instantWins||0;
  t.paymentFeePct=t.paymentFeePct!==undefined?t.paymentFeePct:0.035;
  t.adsSpent=t.adsSpent||0;
  t.dial=t.dial||''; t.setStraps=t.setStraps||''; t.closeNotes=t.closeNotes||''; t.drawNotes=t.drawNotes||'';
  t.ticketsSoldTotal=t.ticketsSoldTotal||0;
  t.launchTicketsSold=t.launchTicketsSold||0;
  t.couponBulkTicketsSold=t.couponBulkTicketsSold||0;
  t.freeTicketsGiven=t.freeTicketsGiven||0;
  t.checkpoints=t.checkpoints||[];
  if(!t.checkpointsGeneratedV2){
    t.checkpoints=buildCheckpointTemplate(d);
    t.checkpointsGeneratedV2=true;
    t.checkpointsGenerated=true;
  }
  // One-time cleanup: older drops had up to 5 checkpoints crammed into the final
  // day (9am/1pm/6pm/7pm/8pm), which meant multiple ticket-count prompts on the
  // same day. Collapse any same-date checkpoints into a single 6pm entry,
  // keeping the highest ticket count already recorded so nothing is lost.
  if(!t.checkpointsCollapsedV1){
    const byDate={};
    (t.checkpoints||[]).forEach(cp=>{ (byDate[cp.date]=byDate[cp.date]||[]).push(cp); });
    const collapsed=[];
    Object.keys(byDate).sort().forEach(date=>{
      const group=byDate[date];
      if(group.length<=1){ collapsed.push(group[0]); return; }
      const dayName=(group[0].label||'').split(' ')[0]||'';
      const maxSold=Math.max(...group.map(g=>Number(g.ticketsSold)||0));
      const anyFilled=group.some(g=>g.filled);
      collapsed.push({id:(group.find(g=>g.filled)||group[0]).id, label:`${dayName} 6pm`.trim(), date, ticketsSold:maxSold, filled:anyFilled, locked:true});
    });
    t.checkpoints=collapsed;
    t.checkpointsCollapsedV1=true;
  }
  if(!d.contentChecklistGenerated){
    d.contentChecklist=buildContentChecklist(d);
    d.contentChecklistGenerated=true;
  }
  d.contentChecklist=d.contentChecklist||[];
}
function migrate(){

  DB.settings.theme=DB.settings.theme||'dark';

  DB.winnerResults=DB.winnerResults||[];
  DB.sourcing=DB.sourcing||[];
  DB.projects=DB.projects||[];
  DB.recurringTasks=(DB.recurringTasks&&DB.recurringTasks.length)?DB.recurringTasks:DEFAULT_RECURRING_TASKS.map(t=>({...t,id:uid('rtpl')}));
  DB.customerImports=DB.customerImports||[];
  (DB.drops||[]).forEach(d=>{
    if(d.type==='Vault'){
      d.vaultPrizes=d.vaultPrizes||[];
      if(!d.vaultPriceHistory||!d.vaultPriceHistory.length){
        const price=Number((d.tracker||{}).fullTicketPrice)||2.49;
        const sold=Number((d.tracker||{}).ticketsSoldTotal)||0;
        d.vaultPriceHistory=[{id:uid('vph'),price,tickets:sold,from:(d.launch||today()),locked:false}];
      }
    }
  });
  DB.fixedCosts=DB.fixedCosts||[];
  DB.notes=DB.notes||[];
  DB.dailyTakings=DB.dailyTakings||[];
  DB.contentScheduleTemplates=DB.contentScheduleTemplates||{};
  Object.keys(DEFAULT_CONTENT_SCHEDULE_TEMPLATES).forEach(ty=>{
    if(!DB.contentScheduleTemplates[ty]) DB.contentScheduleTemplates[ty]=JSON.parse(JSON.stringify(DEFAULT_CONTENT_SCHEDULE_TEMPLATES[ty]));
  });
  Object.keys(DB.contentScheduleTemplates).forEach(ty=>{
    DB.contentScheduleTemplates[ty]=(DB.contentScheduleTemplates[ty]||[]).map(it=>({...it,id:it.id||uid('tpl')}));
  });
  (DB.drops||[]).forEach(migrateDrop);
  (DB.watches||[]).forEach(w=>{
    w.serial=w.serial||''; w.mediaLink=w.mediaLink||''; w.retired=!!w.retired;
    // Derive Model Family + Variant if missing, so Brand→Model→Variant drill-down works
    if(w.family===undefined || w.variant===undefined){
      const sp=splitModel(w.brand,w.model);
      if(w.family===undefined) w.family=sp.family;
      if(w.variant===undefined) w.variant=sp.variant;
    }

      const fromDrop=(DB.drops||[]).find(d=>d.watchId===w.id && d.supplierId);
      w.supplierId = fromDrop ? fromDrop.supplierId : '';
    }
    const old=w.media||{};
    const fresh={};
    CONTENT_CATS.forEach(cat=>{ fresh[slug(cat)]=old[slug(cat)]||[]; });
    if(!w.mediaMigratedV3){
      const pull=(newKey,oldKey)=>{ if(old[oldKey]&&old[oldKey].length) fresh[newKey]=fresh[newKey].concat(old[oldKey]); };
      // from the 8-category structure
      pull(slug('Watch Photos'), slug('Watch Still Content'));
      pull(slug('Watch Video'), slug('Ad Content'));
      pull(slug('Watch Video'), slug('Social Content'));
      pull(slug('Watch Video'), slug('Watch Unboxing')); // old "unboxing" = us unboxing new stock, not winner delivery
      pull(slug('Watch Video'), slug('Funny Content'));
      pull(slug('Watch Video'), slug('BTS Content'));
      pull(slug('Evergreen Video'), slug('Educational Content'));
      pull(slug('Evergreen Video'), slug('Evergreen Content'));
      // from the original 4-bucket structure (images/videos/unboxing/social), in case v2 never ran
      pull(slug('Watch Photos'), 'images');
      pull(slug('Watch Video'), 'videos');
      pull(slug('Watch Video'), 'unboxing');
      pull(slug('Watch Video'), 'social');
      if(!fresh[slug('Watch Photos')].length && w.img) fresh[slug('Watch Photos')].push({id:uid('med'),ref:w.img});
      w.mediaMigratedV3=true;
    }
    w.media=fresh;
  });
  (DB.suppliers||[]).forEach(s=>{ delete s.outstanding; });
  (DB.winners||[]).forEach(w=>{
    w.deliveryInPerson=!!w.deliveryInPerson;
    w.trackingNumber=w.trackingNumber||'';
    w.reviewRequested=!!w.reviewRequested;

    w.reviewTaskCreated=!!w.reviewTaskCreated;

  (DB.tasks||[]).forEach(t=>{
    if(t.type==='Delivery') t.type='Prize Delivery';
    t.type=t.type&&TASK_TYPES[t.type]?t.type:'Admin';
    t.projectId=t.projectId||'';
    if(!t.category){
      const adminTypes=['Finance & Reconciliation','Supplier & Purchasing','Winner & Dispatch','Reporting & Data','Banking & Payments','Legal & Terms'];
      const contentTypes=['Leila Content','Watch Content','Content Creation','Content Editing','Content'];
      if(contentTypes.includes(t.type)) t.category='Content';
      else if(adminTypes.includes(t.type)) t.category='Admin';
      else t.category='Task';
    }
    t.assignedTo=t.assignedTo||DB.settings.team[0];
    t.time=t.time||'';
    t.urgent=!!t.urgent;
    t.personRef=t.personRef||'';
    t.notes=t.notes||''; t.file=t.file||'';
    t.repeat=t.repeat||'None'; t.recurring=t.recurring||false; t.recurringDays=t.recurringDays||[]; t.recurringTime=t.recurringTime||''; t.recurringHour=t.recurringHour||null;
    t.watchId=t.watchId||'';
  });
  const CAT_MIGRATE={'Ideas':'Social Content','Evergreen':'Evergreen Content','Educational':'Educational Content',
    'Trust':'Social Content','Funny':'Funny Content','Behind the Scenes':'BTS Content',
    'Winner Stories':'Social Content','Watch Comparisons':'Educational Content'};
  const CAT_MIGRATE_V2={'Watch Still Content':'Watch Photos','Ad Content':'Watch Video','Social Content':'Watch Video',
    'Watch Unboxing':'Watch Video','Funny Content':'Watch Video','BTS Content':'Watch Video',
    'Educational Content':'Evergreen Video','Evergreen Content':'Evergreen Video'};
  const STATUS_MIGRATE={'Writing':'To Do','Ready':'To Do','Filmed':'To Do','Edited':'To Do',
    'Idea':'To Do','In Motion':'To Do','Posted':'Done','Archived':'Done'};
  (DB.content||[]).forEach(c=>{
    c.video=c.video||''; c.images=c.images||[]; c.assetId=c.assetId||''; c.tags=c.tags||[]; c.watchId=c.watchId||'';
    c.creator=c.creator||(DB.settings.team[0]);

function fillRate(d){ return d.pool? Math.round((d.entriesSold/d.pool)*100) : 0; }
function variableCostsTotal(d){ return (d.variableCosts||[]).reduce((a,c)=>a+(Number(c.amount)||0),0); }
function totalCost(d){ return (Number(d.costWatch)||0)+(Number(d.costFixed)||0)+variableCostsTotal(d); }
function vatAmount(d){ return (Number(d.revenue)||0)*(0.2/1.2); }

/* ---------- Drop Tracker calc engine (mirrors the D33 spreadsheet tab) ---------- */
function trkFullPrice(t){ return Number(t.fullTicketPrice)||0; }
function trkLaunchPrice(t){ return trkFullPrice(t)*(1-(Number(t.launchDiscountPct)||0)); }
function trkCompPrice(t){ return trkFullPrice(t)*(1-(Number(t.compLifeDiscountPct)||0)); }
function trkValueMultiple(t){ const wc=Number(t.watchCost)||0; return wc? (Number(t.statedValue)||0)/wc : 0; }
function trkPaidTickets(t){ return Math.max(0,(Number(t.ticketsSoldTotal)||0)-(Number(t.freeTicketsGiven)||0)); }
function trkLaunchPaid(t){ return Math.min(Number(t.launchTicketsSold)||0, trkPaidTickets(t)); }
function trkCouponPaid(t){ return Math.min(Number(t.couponBulkTicketsSold)||0, Math.max(0, trkPaidTickets(t)-trkLaunchPaid(t))); }
function trkFullPaid(t){ return Math.max(0, trkPaidTickets(t)-trkLaunchPaid(t)-trkCouponPaid(t)); }
function trkRevenueLaunch(t){ return trkLaunchPaid(t)*trkLaunchPrice(t); }
function trkRevenueCoupon(t){ return trkCouponPaid(t)*trkCompPrice(t); }
function trkRevenueFull(t){ return trkFullPaid(t)*trkFullPrice(t); }
function trkGrossRevenue(t){ return trkRevenueLaunch(t)+trkRevenueCoupon(t)+trkRevenueFull(t); }
function trkNetRevenue(t){ return trkGrossRevenue(t)/1.2; }
function trkAvgTicket(t){ const tot=Number(t.ticketsSoldTotal)||0; return tot? trkGrossRevenue(t)/tot : 0; }
function trkPaymentFees(t){ return trkGrossRevenue(t)*(Number(t.paymentFeePct)||0); }
function trkTotalCostsExclFees(t){ return (Number(t.watchCost)||0)+(Number(t.adsBudget)||0)+(Number(t.fixed)||0)+(Number(t.instantWins)||0); }
function trkCostsInclFees(t){ return trkTotalCostsExclFees(t)+trkPaymentFees(t); }
function trkGrossProfit(t){ return trkGrossRevenue(t)-trkCostsInclFees(t); }
function trkVat(t){ return trkGrossRevenue(t)-trkNetRevenue(t); }
function trkNetProfit(t){ return trkGrossProfit(t)-trkVat(t); }
function trkTicketsToProfit(t){ const fp=trkFullPrice(t); return fp? trkNetProfit(t)/fp : 0; }
function trkSellOutRevenue(t){ return trkFullPrice(t)*(Number(t.maxTickets)||0); }
function trkRemainingAdBudget(t){ return (Number(t.adsBudget)||0)-(Number(t.adsSpent)||0); }
function trkBreakEvenTickets(t){ const avg=trkAvgTicket(t); if(!avg) return 0; const feePct=Number(t.paymentFeePct)||0; const netPerTicket=avg/1.2*(1-feePct); return netPerTicket? Math.ceil(trkTotalCostsExclFees(t)/netPerTicket) : 0; }
function trkRemainingTickets(t){ return (Number(t.maxTickets)||0)-(Number(t.ticketsSoldTotal)||0); }
function trkBreakEvenPct(t){ const max=Number(t.maxTickets)||0; return max? trkBreakEvenTickets(t)/max : 0; }
function trkRevenueToSellout(t){ return trkRemainingTickets(t)*trkFullPrice(t); }
function trkCurrentPct(t){ const max=Number(t.maxTickets)||0; return max? (Number(t.ticketsSoldTotal)||0)/max : 0; }
function trkStatus(t){ return trkNetProfit(t)>=0 ? 'PROFITABLE' : 'UNPROFITABLE'; }
function trkCheckpointTotal(t){ return (t.checkpoints||[]).reduce((a,c)=>a+(Number(c.ticketsSold)||0),0); }

  const item={id:uid('tpl'),day,time,channel,title};

/* Maps a template's relative "day number" to the real weekday it falls on,
   based on each drop type's actual launch cadence:
   Main Drop launches Wednesday and runs to the following Wednesday's draw.
   Weekend Drop launches Friday and closes Sunday.
   Tech Drop launches Sunday afternoon and closes Tuesday night. */
const CS_DAY0_WEEKDAY = {'Main Drop':3, 'Weekend Drop':5, 'Tech Drop':0}; // JS getDay(): 0=Sun..6=Sat
function csDayLabel(type, dayNum){
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const start=CS_DAY0_WEEKDAY[type];
  if(start===undefined) return `Day ${dayNum}`;
  const name=dayNames[(start+dayNum)%7];
  return dayNum===0? `Launch (${name})` : name;
}

function trkTotalCostsCombined(d,t){ return (Number(t.watchCost)||0)+(Number(t.fixed)||0)+variableCostsTotal(d)+(Number(t.adsBudget)||0); }
function trkKpiRow(d,t){
  const status=trkStatus(t);
  const totalCostsCombined=trkTotalCostsCombined(d,t);
  const grossRev=trkGrossRevenue(t), costsIncl=trkCostsInclFees(t), vat=trkVat(t), netProfit=trkNetProfit(t);
  const maxTicketsVal=Number(t.maxTickets)||0, soldVal=Number(t.ticketsSoldTotal)||0;
  const ticketsToSellOut=Math.max(0, maxTicketsVal-soldVal);
  const revenueToSellOut=ticketsToSellOut*trkFullPrice(t);
  const breakEvenTicketsTotal=trkBreakEvenTickets(t);
  const ticketsToBreakEven=Math.max(0, breakEvenTicketsTotal-soldVal);
  const revenueToBreakEven=ticketsToBreakEven*trkFullPrice(t);
  const breakEvenPct = breakEvenTicketsTotal>0 ? (soldVal/breakEvenTicketsTotal*100) : 0;
  const launchTicketsN=Number(t.launchTicketsSold)||0, couponTicketsN=Number(t.couponBulkTicketsSold)||0;
  const missedRevenue = launchTicketsN*(trkFullPrice(t)-trkLaunchPrice(t)) + couponTicketsN*(trkFullPrice(t)-trkCompPrice(t));
  return `<div class="kpi-row" style="margin:18px 0">
    <div class="kpi"><div class="label">Current %</div><div class="val">${(trkCurrentPct(t)*100).toFixed(1)}%</div><div class="sub">${soldVal} of ${maxTicketsVal} tickets sold</div>

function buildCheckpointTemplate(d){
  if(d.type==='Free Drop') return []; // no sales tracking needed for free drops
  const dayNames=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const launch=new Date((d.launch||today())+'T00:00:00');
  const cps=[];
  const pushEvening=(offsetDays)=>{
    const dt=new Date(launch); dt.setDate(dt.getDate()+offsetDays);
    cps.push({id:uid('cp'), label:`${dayNames[dt.getDay()]} 8:30pm`, date:localISODate(dt), ticketsSold:0, filled:false, locked:true});
  };
  const pushFinalDay=(offsetDays)=>{
    const dt=new Date(launch); dt.setDate(dt.getDate()+offsetDays);
    const label=dayNames[dt.getDay()]; const dateStr=localISODate(dt);
    cps.push({id:uid('cp'), label:`${label} 6pm`, date:dateStr, ticketsSold:0, filled:false, locked:true});
  };
  if(d.type==='Weekend Drop'){
    // Fri 5:30pm launch (tracked at 8:30pm) -> Sun 8:30pm draw, 2-day span
    pushEvening(1); // Saturday 8:30pm
    pushFinalDay(2); // Sunday — intraday
  } else if(d.type==='Tech Drop'){
    // Sun 5:30pm launch (tracked at 8:30pm) -> Tue 8:30pm draw, 2-day span
    pushEvening(1); // Monday 8:30pm
    pushFinalDay(2); // Tuesday — intraday
  } else {
    // Main Drop and Vault: Wed 8:30pm -> next Wed 8:30pm, 7-day span
    for(let i=1;i<=6;i++) pushEvening(i); // Thu..Tue 8:30pm
    pushFinalDay(7); // final Wed — intraday
  }
  return cps;
}

/* Single source of truth for a drop's headline numbers — used by the Drops table,
   the Dashboard's Live Drops widget, and anywhere else that shows entries/revenue/profit,
   so they never disagree. Prefers the Drop Tracker (full VAT/fees/ads calc) when present. */
function vaultNumbers(d){
  // Mirror the exact same calculation as vaultTrackerBody
  const t=d.tracker||{};
  d.vaultPrizeHistory=d.vaultPriceHistory||[];
  const history=d.vaultPriceHistory||[];
  const totalSold = history.reduce((a,h)=>a+(Number(h.tickets)||0),0)||Number(t.ticketsSoldTotal)||0;
  const grossRev = history.length
    ? history.reduce((a,h)=>a+(Number(h.tickets)||0)*(Number(h.price)||0),0)
    : totalSold*(Number(t.fullTicketPrice)||2.49);
  const creditPct = (Number(t.creditRedemptionPct)||0)/100;
  const cashRev   = grossRev*(1-creditPct);
  const vatAmt    = cashRev*(0.2/1.2);
  const fees      = cashRev*(Number(t.paymentFeePct)||0.01);
  const fixed     = Number(t.fixed)||0;
  const adsBudget = Number(t.adsBudget)||0;
  const prizes    = d.vaultPrizes||[];
  const watchCost = prizes.filter(p=>p.type==='watch').reduce((a,p)=>a+(Number(p.cost)||0),0);
  const cashCost  = prizes.filter(p=>p.type==='cash').reduce((a,p)=>a+(Number(p.amount)||0),0);
  const prizeCost = watchCost+cashCost;
  const totalCost = prizeCost+fixed+adsBudget+fees;
  const netProfit = cashRev-totalCost-vatAmt;
  const pool      = Number(t.maxTickets)||99999;
  return { entries:totalSold, pool, fillPct:pool?Math.round(totalSold/pool*100):0,
    revenue:cashRev, profit:netProfit, isProfitable:netProfit>=0 };
}
function dropNumbers(d){
  if(d.type==='Vault') return vaultNumbers(d);
  if(d.tracker){
    const t=d.tracker;
    const entries=Number(t.ticketsSoldTotal)||0, pool=Number(t.maxTickets)||0;
    return {
      entries, pool, fillPct: pool? Math.round((entries/pool)*100):0,
      revenue: trkGrossRevenue(t), profit: trkNetProfit(t),
      isProfitable: trkNetProfit(t)>=0
    };
  }
  const entries=Number(d.entriesSold)||0, pool=Number(d.pool)||0;
  const p=profit(d);
  return { entries, pool, fillPct: pool? Math.round((entries/pool)*100):0,
    revenue: Number(d.revenue)||0, profit: p, isProfitable: p>=0 };
}

/* ---------- HEIC → JPEG conversion (browsers can't display .heic natively) ---------- */
function convertToJpeg(file){
  return new Promise((resolve)=>{
    // Only convert HEIC/HEIF — pass everything else straight through
    const name = (file.name||'').toLowerCase();
    const isHeic = file.type==='image/heic' || file.type==='image/heif' ||
                   name.endsWith('.heic') || name.endsWith('.heif');
    if(!isHeic){ resolve(file); return; }
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        const canvas = document.createElement('canvas');
        canvas.width = img.naturalWidth;
        canvas.height = img.naturalHeight;
        canvas.getContext('2d').drawImage(img, 0, 0);
        canvas.toBlob((blob)=>{
          if(!blob){ resolve(file); return; } // fallback: send original if conversion fails
          const converted = new File([blob], file.name.replace(/\.hei[cf]$/i,'.jpg'), {type:'image/jpeg'});
          resolve(converted);
        }, 'image/jpeg', 0.92);
      };
      img.onerror = ()=>resolve(file); // fallback
      img.src = e.target.result;
    };
    reader.onerror = ()=>resolve(file); // fallback
    reader.readAsDataURL(file);
  });
}

/* ---------- Media (image/video) storage — real files via R2, streamed through /api/upload ---------- */
function storeMedia(file, onProgress){
  return new Promise(async (resolve,reject)=>{
    if(file.size > 500*1024*1024){ reject(new Error('This file is over 500MB — try compressing it, or paste a hosted link (YouTube/Drive) instead.')); return; }
    if(!sb){ reject(new Error(supabaseLoadError||'Not connected')); return; }
    let token;
    try{
      const { data } = await sb.auth.getSession();
      token = data && data.session && data.session.access_token;
    }catch(e){ reject(new Error('Could not verify your session — try refreshing the page.')); return; }
    if(!token){ reject(new Error('Not signed in.')); return; }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name || 'file'));
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = ()=>{
      if(xhr.status>=200 && xhr.status<300){
        try{ const json=JSON.parse(xhr.responseText); resolve('r2:'+json.key); }
        catch(e){ reject(new Error('Unexpected response from upload — try again.')); }
      } else {
        let msg='Upload failed (status '+xhr.status+')';
        try{ const j=JSON.parse(xhr.responseText); if(j.error) msg=j.error; }catch(e){}
        reject(new Error(msg));
      }
    };
    xhr.onerror = ()=>reject(new Error('Network error during upload — check your connection and try again.'));
    xhr.send(file);
  });
}
function mediaUrl(ref){
  if(!ref) return '';
  if(ref.startsWith('r2:')) return '/api/media/'+ref.slice(3);
  return ref; // plain pasted link, or legacy m_ handled separately in hydrateMedia
}
const _mediaBlobCache={};
async function hydrateMedia(){
  const els=document.querySelectorAll('img[data-mediaref], video[data-mediaref]');
  for(const el of els){
    const ref=el.dataset.mediaref;
    if(!ref){ el.style.display='none'; continue; }
    if(ref.startsWith('r2:')){
      // Use blob URL cache to avoid repeated fetches
      if(_mediaBlobCache[ref]){
        el.src=_mediaBlobCache[ref]; el.style.display=''; continue;
      }
      try{
        let headers={};
        if(sb){ const {data}=await sb.auth.getSession(); if(data&&data.session) headers['Authorization']='Bearer '+data.session.access_token; }
        const res=await fetch(mediaUrl(ref),{headers});
        if(res.ok){
          const blob=await res.blob();
          const url=URL.createObjectURL(blob);
          _mediaBlobCache[ref]=url;
          el.src=url; el.style.display='';
          if(el.tagName==='VIDEO') el.load();
        } else { el.style.display='none'; }
      }catch(e){ el.style.display='none'; }
    } else if(ref.startsWith('m_')){
      try{ const r=await dbStorage.get('atlas:media:'+ref); if(r){el.src=r.value; el.style.display='';} }
      catch(e){ el.style.display='none'; }
    } else { el.src=ref; el.style.display=''; }
  }
}

async function onGalleryUpload(evt,key){
  const files=[...evt.target.files]; if(!files.length) return;
  watchMediaDraft[key]=watchMediaDraft[key]||[];
  for(const file of files){
    const tempId=uid('med');
    watchMediaDraft[key].push({id:tempId,ref:'',uploading:true,progress:0});
    refreshGallery(key);
    try{
      const ref = await storeMedia(file, pct=>{
        const item=watchMediaDraft[key].find(x=>x.id===tempId);
        if(item){ item.progress=pct; refreshGallery(key); }
      });
      const item=watchMediaDraft[key].find(x=>x.id===tempId);
      if(item){ item.ref=ref; item.uploading=false; }
    }catch(e){
      watchMediaDraft[key]=watchMediaDraft[key].filter(x=>x.id!==tempId);
      alert('Upload failed: '+e.message);
    }
    refreshGallery(key);
  }
  evt.target.value='';
}
function removeGalleryItem(evt,id){

/* ---------- CSV parsing ---------- */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {headers:[],rows:[]};
  const split=l=>{
    const out=[];let cur='';let q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(ch===','&&!q){out.push(cur);cur='';}
      else cur+=ch;
    } out.push(cur); return out;
  };
  const headers=split(lines[0]).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>{
    const cells=split(l); const o={}; headers.forEach((h,i)=>o[h]=(cells[i]||'').trim()); return o;
  });
  return {headers,rows};
}

function trkSnapshotStrip(d){
  const t=d.tracker; if(!t) return '';
  // Vault drops use their own calculation
  if(d.type==='Vault'){
    const vn=vaultNumbers(d);
    const prizes=d.vaultPrizes||[];
    const watchCost=prizes.filter(p=>p.type==='watch').reduce((a,p)=>a+(Number(p.cost)||0),0);
    const cashCost=prizes.filter(p=>p.type==='cash').reduce((a,p)=>a+(Number(p.amount)||0),0);
    const prizeCost=watchCost+cashCost;
    const ads=Number(t.adsBudget)||0;
    const fixed=Number(t.fixed)||0;
    const maxTicketsVal=Number(t.maxTickets)||99999;
    const soldVal=vn.entries;
    const fillPct=(soldVal/maxTicketsVal*100).toFixed(1);
    const status=vn.isProfitable?'PROFITABLE':'LOSS';
    return `<div class="kpi-row condensed">
      <div class="kpi"><div class="label">Current %</div><div class="val">${fillPct}%</div><div class="sub">${soldVal} of ${maxTicketsVal} sold</div></div>
      <div class="kpi"><div class="label">Status</div><div class="val" style="${vn.isProfitable?'color:var(--gold2)':'color:var(--danger)'}">${status}</div>
        <div class="sub" style="font-weight:700">${prizeCost>0?gbp(prizeCost)+' prizes won':''}</div></div>
      <div class="kpi"><div class="label">Total Costs</div><div class="val">${gbp(prizeCost+ads+fixed)}</div></div>
      <div class="kpi"><div class="label">Net Profit</div><div class="val" style="${vn.profit>=0?'color:var(--live)':'color:var(--danger)'}">${gbp(vn.profit)}</div></div>`;
  }
  const status=trkStatus(t);
  const netProfit=trkNetProfit(t);
  const totalCostsCombined=trkTotalCostsCombined(d,t);
  const maxTicketsVal=Number(t.maxTickets)||0, soldVal=Number(t.ticketsSoldTotal)||0;
  const breakEvenTicketsTotal=trkBreakEvenTickets(t);
  const breakEvenPct = breakEvenTicketsTotal>0 ? (soldVal/breakEvenTicketsTotal*100) : 0;
  return `<div class="kpi-row condensed">
    <div class="kpi"><div class="label">Current %</div><div class="val">${(trkCurrentPct(t)*100).toFixed(1)}%</div>
      <div class="sub">${soldVal} of ${maxTicketsVal} sold</div>
      <div class="sub" style="margin-top:3px;font-weight:700;color:${breakEvenPct>=100?'var(--live)':breakEvenPct>=75?'var(--gold2)':'var(--ink3)'}">
        ${breakEvenPct>=100?'Break-even reached':'Need '+(100-Math.round(breakEvenPct))+'% more to break-even'}
      </div></div>
    <div class="kpi"><div class="label">Status</div><div class="val" style="${status!=='PROFITABLE'?'color:var(--danger)':'color:var(--gold2)'}">${status}</div>
      <div class="sub" style="font-weight:700;${breakEvenPct>=100?'color:var(--live)':''}">${breakEvenPct.toFixed(0)}% to break-even</div></div>
    <div class="kpi"><div class="label">Total Costs</div><div class="val">${gbp(totalCostsCombined)}</div></div>
    <div class="kpi"><div class="label">Net Profit</div><div class="val" style="${netProfit>=0?'color:var(--live)':'color:var(--danger)'}">${gbp(netProfit)}</div></div>
    <div class="kpi"><div class="label">Ad Spend</div><div class="val">${gbp(t.adsBudget)}</div>
      ${d.type==='Vault'&&d.launch?(()=>{
        const weeksLive=Math.max(0,(new Date()-new Date(d.launch))/(1000*60*60*24*7));
        const expected=Math.round(weeksLive*(Number(t.adWeeklyBudget)||1000));
        const actual=Number(t.adsBudget)||0;
        const delta=actual-expected;
        const col=Math.abs(delta)<100?'var(--live)':delta<0?'var(--warn)':'var(--danger)';
        return `<div class="sub" style="color:${col}">${gbp(expected)} expected</div>`;
      })():''}
    </div>
    ${d.type==='Vault'&&d.launch&&d.draw?(()=>{
      const now=new Date(), launch=new Date(d.launch), draw=new Date(d.draw);
      const daysLive=Math.max(0,Math.round((now-launch)/(1000*60*60*24)));
      const daysLeft=Math.max(0,Math.round((draw-now)/(1000*60*60*24)));
      const total=Math.max(1,Math.round((draw-launch)/(1000*60*60*24)));
      const pct=Math.min(100,Math.round(daysLive/total*100));
      return `<div class="kpi" style="cursor:pointer" onclick="go('drop','${d.id}','overview')">
        <div class="label">Days Live / Left</div>
        <div class="val" style="font-size:18px">${daysLive}d <span style="color:var(--ink3);font-size:14px">/</span> ${daysLeft}d</div>
        <div style="margin-top:6px;height:4px;background:var(--panel2);border-radius:4px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:var(--gold);border-radius:4px"></div>
        </div>
        <div class="sub">${pct}% through</div>
      </div>`;
    })():''}
  </div>
  <div class="muted" style="font-size:11px;margin:-10px 0 18px;cursor:pointer" onclick="go('drop','${d.id}','financials')">Full breakdown → Financials tab</div>`;
}
