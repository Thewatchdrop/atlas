<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0B1220; --bg2:#0E1626; --panel:#111C30; --panel2:#152238;
    --line:#1E2C44; --line2:#28395A;
    --ink:#E8EDF6; --ink2:#AEBBD2; --ink3:#7688A8;
    --gold:#C9A24B; --gold2:#E4C879; --goldsoft:rgba(201,162,75,.14);
    --live:#4ADE80; --live-bg:rgba(74,222,128,.12);
    --warn:#F5A524; --danger:#F26D6D; --blue:#6AA9FF; --purple:#C86DD7;
    --radius:12px; --radius-sm:8px;
    --shadow:0 8px 28px rgba(0,0,0,.42);
    --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden}
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px}
  ::-webkit-scrollbar-track{background:transparent}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:14px}
  a{color:var(--gold2);text-decoration:none}

  #app{display:flex;height:100vh}
  .sidebar{width:236px;background:var(--bg2);border-right:1px solid var(--line);
    display:flex;flex-direction:column;flex-shrink:0}
  .brand{padding:20px 20px 16px;display:flex;align-items:center;gap:11px}
  .logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#8f6f28);
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#0B1220;font-size:17px}
  .brand h1{font-size:16px;font-weight:800;letter-spacing:.3px}
  .brand .sub{font-size:10px;color:var(--ink3);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px}
  .nav{flex:1;overflow-y:auto;padding:6px 10px 20px}
  .nav-group{margin-top:14px}
  .nav-group-label{font-size:10px;text-transform:uppercase;letter-spacing:1.3px;color:var(--ink3);
    padding:6px 10px 4px;font-weight:600}
  .nav-item{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;
    color:var(--ink2);font-weight:500;font-size:13.5px;cursor:pointer;transition:.12s;position:relative}
  .nav-item:hover{background:var(--panel);color:var(--ink)}
  .nav-item.active{background:var(--goldsoft);color:var(--gold2)}
  .nav-item .ico{width:17px;text-align:center;font-size:15px;flex-shrink:0}
  .nav-item .badge{margin-left:auto;background:var(--line2);color:var(--ink2);font-size:10.5px;
    padding:1px 7px;border-radius:20px;font-weight:600}
  .nav-item.active .badge{background:var(--gold);color:#0B1220}

  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:56px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    gap:14px;padding:0 22px;flex-shrink:0;background:var(--bg)}
  .search-wrap{flex:1;max-width:520px;position:relative}
  .search-wrap input{width:100%;background:var(--panel);border:1px solid var(--line);
    color:var(--ink);border-radius:9px;padding:9px 14px 9px 38px;outline:none;transition:.15s}
  .search-wrap input:focus{border-color:var(--gold);background:var(--panel2)}
  .search-wrap .si{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink3);font-size:14px}
  .btn{background:var(--panel);border:1px solid var(--line2);color:var(--ink);padding:9px 15px;
    border-radius:9px;font-weight:600;font-size:13px;transition:.13s;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{background:var(--panel2);border-color:var(--gold)}
  .btn-gold{background:linear-gradient(135deg,var(--gold),#a9852f);color:#0B1220;border:none}
  .btn-gold:hover{background:linear-gradient(135deg,var(--gold2),var(--gold));border:none}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:7px}
  .btn-ghost{background:transparent;border:1px solid var(--line2)}
  .btn-danger{color:var(--danger);border-color:transparent;background:transparent}
  .btn-danger:hover{background:rgba(242,109,109,.1);border-color:transparent}

  .content{flex:1;overflow-y:auto;padding:26px 30px 60px}
  .page-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px;gap:16px;flex-wrap:wrap}
  .page-head h2{font-size:24px;font-weight:800;letter-spacing:-.3px}
  .page-head .desc{color:var(--ink3);font-size:13px;margin-top:3px}
  .page-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}

  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px;margin-bottom:22px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
  .kpi .label{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:600}
  .kpi .val{font-size:26px;font-weight:800;margin-top:7px;letter-spacing:-.5px}
  .kpi .val.gold{color:var(--gold2)}
  .kpi .val.green{color:var(--live)}
  .kpi .sub{font-size:11.5px;color:var(--ink3);margin-top:2px}

  .dash-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  @media(max-width:1100px){.dash-grid{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .card-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;
    justify-content:space-between;gap:10px;flex-wrap:wrap}
  .card-h h3{font-size:14px;font-weight:700}
  .card-h .link{font-size:12px;color:var(--ink3);cursor:pointer}
  .card-h .link:hover{color:var(--gold2)}
  .card-b{padding:8px 0}
  .empty{padding:26px 18px;text-align:center;color:var(--ink3);font-size:13px}
  .empty button{color:var(--gold2);font-weight:600;margin-top:8px}

  .row-item{padding:10px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);
    cursor:pointer;transition:.1s}
  .row-item:last-child{border-bottom:none}
  .row-item:hover{background:var(--panel2)}
  .row-item .tick{width:17px;height:17px;border:1.7px solid var(--line2);border-radius:5px;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.12s}
  .row-item .tick:hover{border-color:var(--gold)}
  .row-item .tick.done{background:var(--gold);border-color:var(--gold);color:#0B1220;font-size:11px;font-weight:800}
  .row-item .txt{flex:1;min-width:0}
  .row-item .txt .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row-item .txt.done .t{text-decoration:line-through;color:var(--ink3)}
  .row-item .meta{font-size:11.5px;color:var(--ink3);margin-top:1px}
  .pill{font-size:10.5px;padding:2px 9px;border-radius:20px;font-weight:600;white-space:nowrap;flex-shrink:0}
  .pill-live{background:var(--live-bg);color:var(--live)}
  .pill-draft{background:var(--line2);color:var(--ink2)}
  .pill-upcoming{background:rgba(106,169,255,.13);color:var(--blue)}
  .pill-done{background:var(--goldsoft);color:var(--gold2)}
  .pill-closed{background:rgba(242,109,109,.12);color:var(--danger)}
  .pill-type{background:var(--panel2);color:var(--ink2);border:1px solid var(--line2)}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
  .gcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;cursor:pointer;transition:.14s}
  .gcard:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:var(--shadow)}
  .gcard .thumb{height:120px;background:linear-gradient(135deg,var(--panel2),var(--bg2));
    display:flex;align-items:center;justify-content:center;font-size:34px;color:var(--line2);position:relative;overflow:hidden}
  .gcard .thumb img{width:100%;height:100%;object-fit:cover}
  .gcard .gbody{padding:13px 15px}
  .gcard .gtitle{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .gcard .gsub{font-size:12px;color:var(--ink3);margin-top:3px}
  .gcard .gmeta{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
    font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
  .tbl td{padding:12px 16px;border-bottom:1px solid var(--line);font-size:13.5px}
  .tbl tr{cursor:pointer}
  .tbl tbody tr:hover{background:var(--panel2)}
  .tbl .strong{font-weight:600}

  .hub-head{display:flex;align-items:flex-start;gap:18px;margin-bottom:20px;flex-wrap:wrap}
  .hub-head .htitle h2{font-size:26px;font-weight:800}
  .hub-head .hmeta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
  .tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto}
  .tab{padding:10px 15px;color:var(--ink3);font-weight:600;font-size:13.5px;border-bottom:2px solid transparent;
    white-space:nowrap;transition:.12s}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--gold2);border-bottom-color:var(--gold)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:900px){.two-col{grid-template-columns:1fr}}
  .field{margin-bottom:14px}
  .field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.7px;
    color:var(--ink3);font-weight:600;margin-bottom:6px}
  .field input,.field textarea{width:100%;background:var(--bg2);border:1px solid var(--line2);
    color:var(--ink);border-radius:8px;padding:9px 12px;outline:none;transition:.13s}
  .field input:focus,.field textarea:focus{border-color:var(--gold);background:var(--panel)}
  .field textarea{resize:vertical;min-height:80px;line-height:1.5}
  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .field-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}

  .timeline{position:relative;padding-left:22px}
  .timeline:before{content:'';position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line2)}
  .tl-item{position:relative;padding:0 0 18px}
  .tl-item:before{content:'';position:absolute;left:-19px;top:4px;width:9px;height:9px;border-radius:50%;
    background:var(--gold);box-shadow:0 0 0 3px var(--bg)}
  .tl-item .tl-t{font-weight:600;font-size:13.5px}
  .tl-item .tl-d{font-size:11.5px;color:var(--ink3);margin-top:1px}

  .overlay{position:fixed;inset:0;background:rgba(4,8,16,.7);backdrop-filter:blur(3px);
    z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:60px 20px;overflow-y:auto}
  .modal{background:var(--bg2);border:1px solid var(--line2);border-radius:16px;width:100%;max-width:560px;
    box-shadow:var(--shadow);animation:pop .18s ease}
  .modal.wide{max-width:760px}
  @keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
  .modal-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}
  .modal-h h3{font-size:17px;font-weight:800}
  .modal-h .x{color:var(--ink3);font-size:22px;line-height:1;cursor:pointer;padding:4px}
  .modal-h .x:hover{color:var(--ink)}
  .modal-b{padding:20px 22px;max-height:65vh;overflow-y:auto;position:relative}
  .modal-f{padding:15px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px}

  .sresults{position:absolute;top:46px;left:0;right:0;background:var(--bg2);border:1px solid var(--line2);
    border-radius:11px;box-shadow:var(--shadow);z-index:60;max-height:60vh;overflow-y:auto;padding:6px;display:none}
  .sresult-group{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);
    padding:9px 12px 4px;font-weight:700}
  .sresult{padding:9px 12px;border-radius:8px;display:flex;align-items:center;gap:11px;cursor:pointer}
  .sresult:hover{background:var(--panel)}
  .sresult .ri{width:16px;text-align:center;color:var(--gold)}
  .sresult .rt{font-weight:500;flex:1}
  .sresult .rtype{font-size:11px;color:var(--ink3)}

  .filters{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
  .fbtn{padding:6px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--panel);
    border:1px solid var(--line);color:var(--ink2)}
  .fbtn:hover{border-color:var(--line2)}
  .fbtn.active{background:var(--goldsoft);color:var(--gold2);border-color:var(--gold)}

  .asset-tile{position:relative;border-radius:10px;overflow:hidden;aspect-ratio:1;background:var(--panel2);
    border:1px solid var(--line);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--line2)}
  .asset-tile img,.asset-tile video{width:100%;height:100%;object-fit:cover}
  .asset-tile .atag{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.8));
    padding:14px 8px 6px;font-size:11px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .asset-dl{position:absolute;top:6px;right:6px;width:26px;height:26px;border-radius:7px;background:rgba(11,18,32,.75);
    color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;text-decoration:none;backdrop-filter:blur(2px)}
  .asset-dl:hover{background:var(--gold);color:#0B1220}
  .asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--panel2);
    border:1px solid var(--gold);color:var(--ink);padding:12px 20px;border-radius:11px;box-shadow:var(--shadow);
    z-index:200;font-weight:600;font-size:13px;animation:pop .2s}

  .divider{height:1px;background:var(--line);margin:22px 0}
  .muted{color:var(--ink3)}
  .mono{font-variant-numeric:tabular-nums}
  .add-inline{display:flex;gap:8px;padding:10px 18px;flex-wrap:wrap;align-items:center}
  .add-inline input{flex:1;min-width:160px;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:8px 12px;outline:none}
  .add-inline input:focus{border-color:var(--gold)}
  .add-inline .dd{min-width:150px}
  .loading{padding:60px;text-align:center;color:var(--ink3)}
  .section-sub{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--ink3);
    font-weight:700;margin:20px 0 12px}
  .kanban{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
  .kcol{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px}
  .kcol-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--ink2);
    margin-bottom:10px;display:flex;justify-content:space-between}
  .kcard{background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;margin-bottom:9px;cursor:pointer}
  .kcard:hover{border-color:var(--gold)}
  .kcard .kt{font-weight:600;font-size:13px}
  .kcard .km{font-size:11px;color:var(--ink3);margin-top:4px}

  .dd{position:relative}
  .dd-btn{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line2);color:var(--ink);
    border-radius:8px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dd-btn:hover{border-color:var(--gold)}
  .dd-label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dd-car{color:var(--ink3);font-size:10px;flex-shrink:0}
  .dd-menu{display:none;position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);
    border:1px solid var(--line2);border-radius:9px;box-shadow:var(--shadow);z-index:90;max-height:230px;overflow-y:auto;padding:4px}
  .dd-menu.open{display:block}
  .dd-opt{padding:8px 12px;border-radius:6px;cursor:pointer;font-size:13.5px}
  .dd-opt:hover{background:var(--panel)}
  .dd-opt.sel{color:var(--gold2);font-weight:600}

  .media-box{background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:9px}
  .media-row{display:flex;gap:8px}
  .media-row input{flex:1;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:8px 10px;color:var(--ink);outline:none}
  .media-row input:focus{border-color:var(--gold)}
  .media-upload{white-space:nowrap;cursor:pointer}
  .media-prev{width:100%;max-height:130px;object-fit:cover;border-radius:7px;margin-bottom:8px;display:block}

  .mission-list{padding:4px 0}
  .mission-item{display:flex;align-items:center;gap:11px;padding:11px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .mission-item:last-child{border-bottom:none}
  .mission-item:hover{background:var(--panel2)}
  .m-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
  .m-time{font-size:12px;color:var(--ink3);width:44px;flex-shrink:0;font-variant-numeric:tabular-nums}
  .m-ico{font-size:14px;flex-shrink:0}
  .m-label{flex:1;font-weight:500;font-size:13.5px}

  .ttype-dot{width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:11px;flex-shrink:0;opacity:.92}

  .taskboard{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;padding:14px 18px}
  .tb-col{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:12px;display:flex;flex-direction:column;min-height:120px}
  .tb-col.tb-urgent{border-color:var(--danger)}
  .tb-col-h{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
  .tb-count{margin-left:auto;background:var(--line2);color:var(--ink2);font-size:10.5px;padding:1px 7px;border-radius:20px;font-weight:700}
  .tb-col-list{flex:1;display:flex;flex-direction:column;gap:2px}
  .tb-row{display:flex;align-items:center;gap:8px;padding:7px 4px;border-radius:7px;cursor:pointer;font-size:12.5px}
  .tb-row:hover{background:var(--panel2)}
  .tb-tick{width:15px;height:15px}
  .tb-flag{font-size:11px}
  .tb-label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tb-empty{color:var(--ink3);font-size:12px;padding:6px 4px}
  .tb-sub{font-size:10px;text-transform:uppercase;color:var(--ink3);font-weight:700;margin:8px 0 4px;letter-spacing:.5px}
  .tb-col-f{margin-top:8px;text-align:right}
  .tb-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

  .cal-nav{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .cal-nav h3{font-size:16px;font-weight:800;flex:1}
  .cal-grid-head{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:6px}
  .cal-grid-head div{font-size:11px;text-transform:uppercase;color:var(--ink3);font-weight:700;text-align:center}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
  .cal-cell{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-height:96px;padding:7px;cursor:pointer}
  .cal-cell.empty{background:transparent;border:none;cursor:default}
  .cal-cell.today{border-color:var(--gold)}
  .cal-cell:hover{border-color:var(--line2)}
  .cal-daynum{font-size:12px;font-weight:700;color:var(--ink2);margin-bottom:5px}
  .cal-ev{display:block;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal-more{font-size:10.5px;color:var(--ink3);margin-top:2px}

  .brand-group{margin-bottom:26px}
  .brand-head{display:flex;align-items:center;gap:10px;cursor:pointer;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .brand-head h3{font-size:16px;font-weight:800}
  .bg-car{color:var(--ink3);font-size:12px;width:14px}
  .brand-grid.collapsed{display:none}

  .login-screen{height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
  .login-box{width:100%;max-width:360px;padding:36px 32px;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .login-box .logo{width:44px;height:44px;font-size:22px;margin-bottom:18px}
  .login-box h2{font-size:20px;font-weight:800;margin-bottom:4px}

/* ---------- Supabase config ---------- */
/* NOTE: our client is named "sb", not "supabase" — the Supabase library
   itself creates a global called "supabase" when it loads from the CDN,
   so naming our own variable the same thing causes the whole script to
   fail to parse (duplicate global declaration). */
const SUPABASE_URL = 'https://dkhvgzqfograzcrhsedz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_WCJwO2il8A3sXFpamAxOQQ_uJXOmDOp';

let supabaseLoadError = '';
try{
  if(!window.supabase) throw new Error('Supabase library did not load');
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
}catch(e){
  console.error('Supabase failed to initialise:', e);

  const el=document.getElementById('loginErr'); if(el) el.textContent=msg;

/* ---------- Storage wrapper (same shape as window.storage, backed by a Supabase table) ---------- */
const dbStorage = {
  async get(key){
    if(!sb) throw new Error(supabaseLoadError||'Not connected');
    const { data, error } = await sb.from('atlas_kv').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('storage get error', error); return null; }
    if(!data) return null;
    return { key, value: data.value };
  },
  async set(key, value){
    if(!sb) throw new Error(supabaseLoadError||'Not connected');
    const { error } = await sb.from('atlas_kv').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.error('storage set error', error); return null; }
    return { key, value };
  }
};

async function doSignIn(){
  if(!sb){ showLoginErr(supabaseLoadError); return; }
  const email=document.getElementById('loginEmail').value.trim();

  const errEl=document.getElementById('loginErr'); errEl.textContent='';
  if(!email || !password){ errEl.textContent='Enter both email and password.'; return; }
  const btn=document.getElementById('loginBtn'); btn.textContent='Signing in…';
  let result;
  try{ result = await sb.auth.signInWithPassword({ email, password }); }
  catch(e){ btn.textContent='Sign in'; errEl.textContent='Network error reaching Supabase — check your connection and try again.'; return; }
  btn.textContent='Sign in';
  if(result.error){ errEl.textContent = result.error.message || 'Could not sign in — check your email and password.'; return; }
  await bootApp();
}

  if(sb) await sb.auth.signOut();

async function bootApp(){

}
async function checkSessionAndBoot(){
  if(!sb){ showLoginErr(supabaseLoadError); return; }
  const { data:{ session } } = await sb.auth.getSession();
  if(session){ await bootApp(); }
  else { document.getElementById('loginScreen').style.display='flex'; }
}

}

/* ---------- Custom dropdown component ---------- */
function dd(id, options, selected, onchange){
  const norm = options.map(o=> (o && typeof o==='object')? o : {value:o,label:o});
  const sel = norm.find(o=>o.value===selected) || norm[0] || {value:'',label:''};
  return `<div class="dd" id="${id}" data-value="${esc(sel.value)}" data-onchange="${onchange||''}">
    <button type="button" class="dd-btn" onclick="toggleDD('${id}')"><span class="dd-label">${esc(sel.label)}</span><span class="dd-car">▾</span></button>
    <div class="dd-menu" id="${id}_menu">
      ${norm.map(o=>`<div class="dd-opt ${o.value===sel.value?'sel':''}" data-value="${esc(o.value)}" onclick="selectDD('${id}', this)">${esc(o.label)}</div>`).join('')}
    </div>
  </div>`;
}
function toggleDD(id){
  const menu=document.getElementById(id+'_menu'); if(!menu) return;
  const willOpen=!menu.classList.contains('open');
  document.querySelectorAll('.dd-menu.open').forEach(m=>m.classList.remove('open'));
  if(willOpen) menu.classList.add('open');
}
function selectDD(id, el){
  const val = el.dataset.value, label = el.textContent;
  const wrap=document.getElementById(id); if(!wrap) return;
  wrap.dataset.value=val;
  wrap.querySelector('.dd-label').textContent=label;
  wrap.querySelectorAll('.dd-opt').forEach(o=>o.classList.toggle('sel', o===el));
  document.getElementById(id+'_menu').classList.remove('open');
  const cb=wrap.dataset.onchange; if(cb && window[cb]) window[cb](id,val);
}
function ddVal(id){ const el=document.getElementById(id); return el? el.dataset.value : ''; }
document.addEventListener('click',e=>{

});

/* ---------- Media (image/video) storage — real files via R2, streamed through /api/upload ---------- */
function storeMedia(file, onProgress){
  return new Promise(async (resolve,reject)=>{
    if(file.size > 500*1024*1024){ reject(new Error('This file is over 500MB — try compressing it, or paste a hosted link (YouTube/Drive) instead.')); return; }
    if(!sb){ reject(new Error(supabaseLoadError||'Not connected')); return; }
    let token;
    try{
      const { data } = await sb.auth.getSession();
      token = data && data.session && data.session.access_token;
    }catch(e){ reject(new Error('Could not verify your session — try refreshing the page.')); return; }
    if(!token){ reject(new Error('Not signed in.')); return; }

    const xhr = new XMLHttpRequest();
    xhr.open('POST', '/api/upload');
    xhr.setRequestHeader('Authorization', 'Bearer ' + token);
    xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
    xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name || 'file'));
    xhr.upload.onprogress = (e)=>{
      if(e.lengthComputable && onProgress) onProgress(Math.round(e.loaded/e.total*100));
    };
    xhr.onload = ()=>{
      if(xhr.status>=200 && xhr.status<300){
        try{ const json=JSON.parse(xhr.responseText); resolve('r2:'+json.key); }
        catch(e){ reject(new Error('Unexpected response from upload — try again.')); }
      } else {
        let msg='Upload failed (status '+xhr.status+')';
        try{ const j=JSON.parse(xhr.responseText); if(j.error) msg=j.error; }catch(e){}
        reject(new Error(msg));
      }
    };
    xhr.onerror = ()=>reject(new Error('Network error during upload — check your connection and try again.'));
    xhr.send(file);
  });
}
function mediaUrl(ref){
  if(!ref) return '';
  if(ref.startsWith('r2:')) return '/api/media/'+ref.slice(3);
  return ref; // plain pasted link, or legacy m_ handled separately in hydrateMedia
}
async function hydrateMedia(){
  const els=document.querySelectorAll('img[data-mediaref], video[data-mediaref]');
  for(const el of els){
    const ref=el.dataset.mediaref;
    if(!ref){ el.style.display='none'; continue; }
    if(ref.startsWith('r2:')){
      el.src = mediaUrl(ref); el.style.display='';
    } else if(ref.startsWith('m_')){
      // legacy: small files uploaded before R2 was wired up, still stored as base64 in Supabase
      try{ const r=await dbStorage.get('atlas:media:'+ref); el.src=r.value; el.style.display=''; }
      catch(e){ el.style.display='none'; }
    } else { el.src=ref; el.style.display=''; }
  }
}
function mediaDownloadLink(ref){
  if(!ref || !ref.startsWith('r2:')) return '';
  return `<a href="${mediaUrl(ref)}?download=1" class="btn btn-sm btn-ghost" style="margin-top:6px;display:inline-flex" download>⬇ Download</a>`;
}
function mediaField(id,label,value,save){
  const attrs = save? ` data-save-type="${save.type}" data-save-id="${save.id}" data-save-field="${save.field}"` : '';
  const v=value||'';
  return `<div class="field"><label>${label}</label>
    <div class="media-box" id="${id}_box" data-ref="${esc(v)}"${attrs}>
      <img class="media-prev" id="${id}_prev" data-mediaref="${esc(v)}" style="${v?'':'display:none'}">
      <div class="media-row">
        <input type="text" id="${id}" placeholder="Paste image URL…" value="${v&&!String(v).startsWith('m_')&&!String(v).startsWith('r2:')?esc(v):''}" oninput="onMediaURLInput('${id}')">
        <label class="btn btn-sm btn-ghost media-upload" id="${id}_uploadbtn">Upload<input type="file" accept="image/*" style="display:none" onchange="onMediaUpload(event,'${id}')"></label>
      </div>
      <div id="${id}_dl">${mediaDownloadLink(v)}</div>
    </div></div>`;
}
function videoField(id,label,value){
  const v=value||'';
  return `<div class="field"><label>${label}</label>
    <div class="media-box" id="${id}_box" data-ref="${esc(v)}">
      <div class="media-row">
        <input type="text" id="${id}" placeholder="Paste video link (YouTube, Drive, Vimeo) or upload a file…" value="${v&&!String(v).startsWith('m_')&&!String(v).startsWith('r2:')?esc(v):''}" oninput="onMediaURLInput('${id}')">
        <label class="btn btn-sm btn-ghost media-upload" id="${id}_uploadbtn">Upload<input type="file" accept="video/*" style="display:none" onchange="onMediaUpload(event,'${id}')"></label>
      </div>
      <div id="${id}_dl">${mediaDownloadLink(v)}</div>
    </div></div>`;
}
function mediaVal(id){ const el=document.getElementById(id+'_box'); return el? (el.dataset.ref||'') : ''; }
function persistMediaBox(id){
  const box=document.getElementById(id+'_box'); if(!box) return;
  const type=box.dataset.saveType; if(!type) return;
  const oid=box.dataset.saveId, field=box.dataset.saveField, ref=box.dataset.ref||'';
  if(type==='drop-image'){ const d=dropById(oid); if(d){ d.images=d.images||{}; d.images[field]=ref; queueSave(); } }
}
async function onMediaUpload(e,id){
  const f=e.target.files[0]; if(!f) return;
  const btn=document.getElementById(id+'_uploadbtn');
  const originalLabel = btn ? btn.firstChild.textContent : 'Upload';
  try{
    const key = await storeMedia(f, (pct)=>{ if(btn) btn.firstChild.textContent = `Uploading… ${pct}%`; });
    const box=document.getElementById(id+'_box'); box.dataset.ref=key;
    const urlInput=document.getElementById(id); if(urlInput) urlInput.value='';
    const prev=document.getElementById(id+'_prev'); if(prev){ prev.dataset.mediaref=key; prev.style.display='block'; }
    const dl=document.getElementById(id+'_dl'); if(dl) dl.innerHTML = mediaDownloadLink(key);
    persistMediaBox(id); hydrateMedia(); toast('Uploaded');
  }catch(err){ alert(err.message); }
  finally{ if(btn) btn.firstChild.textContent = originalLabel; e.target.value=''; }
}
function onMediaURLInput(id){
  const v=document.getElementById(id).value.trim();
  const box=document.getElementById(id+'_box'); box.dataset.ref=v;
  const prev=document.getElementById(id+'_prev'); if(prev){ prev.dataset.mediaref=v; prev.style.display=v?'block':'none'; }
  const dl=document.getElementById(id+'_dl'); if(dl) dl.innerHTML = mediaDownloadLink(v);
  persistMediaBox(id);
  hydrateMedia();
}

/* ---------- CSV parsing ---------- */
function parseCSV(text){
  const lines=text.split(/\r?\n/).filter(l=>l.trim().length);
  if(!lines.length) return {headers:[],rows:[]};
  const split=l=>{
    const out=[];let cur='';let q=false;
    for(let i=0;i<l.length;i++){const ch=l[i];
      if(ch==='"'){ if(q&&l[i+1]==='"'){cur+='"';i++;} else q=!q; }
      else if(ch===','&&!q){out.push(cur);cur='';}
      else cur+=ch;
    } out.push(cur); return out;
  };
  const headers=split(lines[0]).map(h=>h.trim());
  const rows=lines.slice(1).map(l=>{
    const cells=split(l); const o={}; headers.forEach((h,i)=>o[h]=(cells[i]||'').trim()); return o;
  });
  return {headers,rows};
}

/* ================= TASKS ================= */
let taskFilter='Today', taskPerson='All', taskUrgentOnly=false;
function vTasks(){
  const groups={Today:[],Tomorrow:[],'This Week':[],Overdue:[],Completed:[]};
  const tmr=addDays(today(),1), wk=addDays(today(),7);
  let all=DB.tasks.filter(t=> taskPerson==='All' || t.assignedTo===taskPerson);
  if(taskUrgentOnly) all=all.filter(t=>t.urgent);
  all.forEach(t=>{
    if(t.done){groups.Completed.push(t);return;}
    if(t.due<today())groups.Overdue.push(t);
    else if(t.due===today())groups.Today.push(t);
    else if(t.due===tmr)groups.Tomorrow.push(t);
    else if(t.due<=wk)groups['This Week'].push(t);
  });
  const cats=['Today','Tomorrow','This Week','Overdue','Completed'];
  const list=groups[taskFilter]||[];
  return `<div class="page-head"><div><h2>Tasks</h2><div class="desc">Everything you need to do, typed and assigned.</div></div></div>
  <div class="filters">${cats.map(c=>`<button class="fbtn ${taskFilter===c?'active':''}" onclick="taskFilter='${c}';render()">${c} · ${groups[c].length}</button>`).join('')}</div>
  <div class="filters">${['All',...teamList()].map(p=>`<button class="fbtn ${taskPerson===p?'active':''}" onclick="taskPerson='${p}';render()">${p}</button>`).join('')}<button class="fbtn" onclick="addTeamMember()">＋ Person</button>
    <button class="fbtn ${taskUrgentOnly?'active':''}" onclick="taskUrgentOnly=!taskUrgentOnly;render()">⚡ Urgent only</button></div>
  <div class="card"><div class="card-b">
    ${list.length? list.map(t=>taskRow(t)).join('') : `<div class="empty">Nothing in ${taskFilter}.</div>`}
    <div class="add-inline"><input id="pageTask" placeholder="Add a task…" onkeydown="if(event.key==='Enter')pageAddTask()">
      ${dd('pageTaskDropDD',[{value:'',label:'No drop'},...DB.drops.map(d=>({value:d.id,label:d.number}))],'')}
      <button class="btn btn-sm" onclick="pageAddTask()">Add</button></div>
  </div></div>`;
}

let calMode='list', calMonth=today().slice(0,7);
function vCalendar(){
  const events=[];
  DB.drops.forEach(d=>{

    if(d.draw)events.push({date:d.draw,label:`${d.number} draw — ${watchName(d.watchId)}`,type:'Draw',id:d.id});

  DB.tasks.filter(t=>!t.done).forEach(t=>events.push({date:t.due,label:t.title,type:'Task',id:t.dropId}));
  DB.winners.filter(w=>!w.dispatched&&w.dropId).forEach(w=>{const d=dropById(w.dropId);if(d)events.push({date:d.draw,label:`Dispatch to ${w.name}`,type:'Delivery',id:w.dropId});});
  events.sort((a,b)=>(a.date||'z').localeCompare(b.date||'z'));
  return `<div class="page-head"><div><h2>Calendar</h2><div class="desc">Drops, draws, tasks, deliveries — visualised.</div></div>
    <div class="page-actions"><button class="btn btn-sm ${calMode==='list'?'btn-gold':''}" onclick="calMode='list';render()">List</button>
    <button class="btn btn-sm ${calMode==='grid'?'btn-gold':''}" onclick="calMode='grid';render()">Grid</button></div></div>
  ${calMode==='grid'? calendarGrid(events) : calendarList(events.filter(e=>e.date>=today()))}`;
}
function calendarList(upcoming){
  const byDate={}; upcoming.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  return Object.keys(byDate).length? Object.keys(byDate).sort().map(date=>`
    <div class="section-sub">${date===today()?'Today · ':''}${fmtDate(date)}</div>
    <div class="card"><div class="card-b">${byDate[date].map(e=>`
      <div class="row-item" ${e.id?`onclick="go('drop','${e.id}')"`:''}>
        <span class="pill ${CAL_TYPE_PILL[e.type]||'pill-draft'}">${e.type}</span>
        <div class="txt"><div class="t">${esc(e.label)}</div></div></div>`).join('')}</div></div>`).join('')
  : `<div class="card"><div class="empty">Nothing scheduled ahead.</div></div>`;
}
function calendarGrid(events){
  const [y,m]=calMonth.split('-').map(Number);
  const first=new Date(y,m-1,1); const startDow=(first.getDay()+6)%7;
  const daysInMonth=new Date(y,m,0).getDate();
  const byDate={}; events.forEach(e=>{(byDate[e.date]=byDate[e.date]||[]).push(e);});
  let cells='';
  for(let i=0;i<startDow;i++) cells+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const evs=byDate[dateStr]||[];
    cells+=`<div class="cal-cell ${dateStr===today()?'today':''}" onclick="${evs[0]&&evs[0].id?`go('drop','${evs[0].id}')`:''}">
      <div class="cal-daynum">${d}</div>
      ${evs.slice(0,3).map(e=>`<span class="cal-ev pill ${CAL_TYPE_PILL[e.type]||'pill-draft'}">${esc(e.label.slice(0,18))}</span>`).join('')}
      ${evs.length>3?`<div class="cal-more">+${evs.length-3} more</div>`:''}
    </div>`;
  }
  const monthLabel=first.toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return `<div class="cal-nav"><button class="btn btn-sm" onclick="calShift(-1)">←</button>
    <h3>${monthLabel}</h3><button class="btn btn-sm" onclick="calShift(1)">→</button>
    <button class="btn btn-sm btn-ghost" onclick="calMonth=today().slice(0,7);render()">Today</button></div>
    <div class="cal-grid-head">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(dn=>`<div>${dn}</div>`).join('')}</div>
    <div class="cal-grid">${cells}</div>`;
}
function calShift(n){ const [y,m]=calMonth.split('-').map(Number); const d=new Date(y,m-1+n,1); calMonth=d.toISOString().slice(0,7); render(); }

function libraryItems(){
  const items=[];
  DB.content.forEach(c=>{
    if(c.video){
      items.push({id:'cn_'+c.id, name:c.title, type:'Video', url:c.video, dropId:c.dropId||'',
        tags:c.tags||[], creator:c.creator||teamList()[0], useCase:c.useCase||'Organic Post',
        sourceType:'content', sourceId:c.id});
    }
  });
  DB.drops.forEach(d=>{
    const imgs=d.images||{};
    [['main','Main Image'],['cat1','Catalogue 1'],['cat2','Catalogue 2'],['cat3','Catalogue 3'],['webHero','Homepage Web'],['phoneHero','Homepage Phone']].forEach(([k,label])=>{
      if(imgs[k]) items.push({id:'dr_'+d.id+'_'+k, name:`${d.number} — ${label}`, type:'Photo', url:imgs[k], dropId:d.id,
        tags:[watchName(d.watchId)], creator:'', useCase:'', sourceType:'drop-image', sourceId:d.id});
    });
  });
  DB.assets.forEach(a=>{
    items.push({id:'as_'+a.id, name:a.name, type:a.type, url:a.url, dropId:a.dropId||'',
      tags:a.tags||[], creator:'', useCase:'', sourceType:'asset', sourceId:a.id});
  });
  return items;
}
function libTile(i){
  const body = i.type==='Video'
    ? (i.url? `<video data-mediaref="${esc(i.url)}" muted></video>` : '🎬')
    : (i.url? `<img data-mediaref="${esc(i.url)}">` : '🖼');
  const dl = i.url && i.url.startsWith('r2:') ? `<a href="${mediaUrl(i.url)}?download=1" class="asset-dl" onclick="event.stopPropagation()" download title="Download">⬇</a>` : '';
  return `<div class="asset-tile" onclick="openLibItem('${i.id}')">${body}${dl}<div class="atag">${esc(i.name)}</div></div>`;
}
function openLibItem(id){
  const i=libraryItems().find(x=>x.id===id); if(!i) return;
  if(i.sourceType==='content'){ go('content'); setTimeout(()=>openContent(i.sourceId),50); }
  else if(i.sourceType==='drop-image'){ go('drop', i.sourceId, 'files'); }
  else if(i.sourceType==='asset'){ openAsset(i.sourceId); }

  if(!filtered.length) return head+`<div class="card"><div class="empty">Nothing here yet. Finish a video in New Content, or add photos in a Drop Hub — it'll appear here automatically.</div></div>`;

  return head+`<div class="asset-grid">${filtered.map(i=>libTile(i)).join('')}</div>`;

function assetTile(a){

/* ---------- Universal Search ---------- */
function universalSearch(q){
  q=q.toLowerCase().trim();if(!q)return[];
  const R=[];
  const push=(type,ico,label,fn)=>R.push({type,ico,label,fn});
  DB.drops.forEach(d=>{if((d.number+' '+watchName(d.watchId)+' '+d.notes+' '+d.type).toLowerCase().includes(q))
    push('Drop','⬡',`${d.number} — ${watchName(d.watchId)}`,()=>go('drop',d.id));});
  DB.watches.forEach(w=>{if((w.brand+' '+w.model+' '+w.ref+' '+(w.serial||'')+' '+(w.desc||'')).toLowerCase().includes(q))
    push('Watch','⌚',`${w.brand} ${w.model}`,()=>{go('watches');setTimeout(()=>openWatch(w.id),50);});});
  DB.winners.forEach(w=>{if((w.name+' '+(w.instagram||'')+' '+(w.notes||'')).toLowerCase().includes(q))
    push('Winner','★',w.name,()=>{go('winners');setTimeout(()=>openWinner(w.id),50);});});
  DB.suppliers.forEach(s=>{if((s.name+' '+(s.contact||'')).toLowerCase().includes(q))
    push('Supplier','▤',s.name,()=>{go('suppliers');setTimeout(()=>openSupplier(s.id),50);});});
  DB.content.forEach(c=>{if((c.title+' '+c.body+' '+(c.tags||[]).join(' ')+' '+c.category+' '+(c.creator||'')).toLowerCase().includes(q))
    push('Content','✎',c.title,()=>{go('content');setTimeout(()=>openContent(c.id),50);});});
  DB.assets.forEach(a=>{if((a.name+' '+(a.tags||[]).join(' ')+' '+a.type).toLowerCase().includes(q))
    push('Asset','▣',a.name,()=>{go('assets');setTimeout(()=>openAsset(a.id),50);});});
  DB.tasks.forEach(t=>{if((t.title+' '+(t.assignedTo||'')+' '+(t.type||'')).toLowerCase().includes(q))
    push('Task','☑',t.title,()=>go('tasks'));});
  DB.ideas.forEach(i=>{if(i.text.toLowerCase().includes(q))push('Idea','✦',i.text,()=>go('ideas'));});
  DB.sops.forEach(s=>{if((s.title+' '+s.body).toLowerCase().includes(q))push('SOP','❐',s.title,()=>{go('sops');setTimeout(()=>openSop(s.id),50);});});
  DB.kb.forEach(k=>{if((k.title+' '+k.body).toLowerCase().includes(q))push('Knowledge','◈',k.title,()=>{go('kb');setTimeout(()=>openKB(k.id),50);});});
  return R;
}
let searchIdx=[];
function doSearch(){
  const q=document.getElementById('search').value;
  const box=document.getElementById('sresults');
  if(!q.trim()){box.innerHTML='';box.style.display='none';return;}
  const res=universalSearch(q);searchIdx=res;
  if(!res.length){box.innerHTML='<div class="sresult"><span class="rt muted">No matches for "'+esc(q)+'"</span></div>';box.style.display='block';return;}
  const groups={};res.forEach((r,i)=>{(groups[r.type]=groups[r.type]||[]).push({...r,i});});
  box.innerHTML=Object.keys(groups).map(g=>`<div class="sresult-group">${g}s · ${groups[g].length}</div>`+
    groups[g].slice(0,6).map(r=>`<div class="sresult" onclick="pickSearch(${r.i})"><span class="ri">${r.ico}</span>
      <span class="rt">${esc(r.label.slice(0,70))}</span><span class="rtype">${r.type}</span></div>`).join('')).join('');
  box.style.display='block';
}
function pickSearch(i){const r=searchIdx[i];document.getElementById('search').value='';
  document.getElementById('sresults').style.display='none';r.fn();}
document.getElementById('search').addEventListener('input',doSearch);
document.addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();document.getElementById('search').focus();}
  if(e.key==='Escape')closeModal();});

/* ---------- Toast ---------- */
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2200);}

/* ---------- Boot ---------- */
checkSessionAndBoot();
</script>
