function delSop(id){ if(!confirm('Delete?')) return; DB.sops=DB.sops.filter(x=>x.id!==id); closeModal(); saveDB(); render(); }

function vKB(){
  return `<div class="page-head"><div><h2>Knowledge Base</h2></div><div class="page-actions"><button class="btn btn-gold" onclick="openKB()">＋ Add Article</button></div></div>
  <div class="grid">${DB.kb.length?DB.kb.map(k=>`<div class="gcard" onclick="openKB('${k.id}')"><div class="gbody"><div class="gtitle">${esc(k.title)}</div><div class="gsub">${esc(k.category||'')}</div><div style="font-size:12px;color:var(--ink3);margin-top:6px;max-height:60px;overflow:hidden">${esc((k.body||'').slice(0,180))}</div></div></div>`).join(''):`<div class="empty">No KB articles yet.</div>`}`;
}
function openKB(id=null){ let k; const isNew=!id; if(isNew){ k={id:uid('kb'),title:'',category:'',body:'',created:now()}; DB.kb.push(k); } else k=DB.kb.find(x=>x.id===id); if(!k) return; openModal(`<div class="modal wide"><div class="modal-h"><h3>${isNew?'New Article':'Edit Article'}</h3><span class="x" onclick="closeModal()">×</span></div><div class="modal-b"><div class="field"><label>Title</label><input id="kb_title" value="${esc(k.title)}"></div><div class="field"><label>Category</label><input id="kb_cat" value="${esc(k.category||'')}"></div><div class="field"><label>Body</label><textarea id="kb_body" rows="14">${esc(k.body)}</textarea></div></div><div class="modal-f"><button class="btn btn-danger" onclick="delKB('${k.id}')">Delete</button><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-gold" onclick="saveKB('${k.id}')">Save</button></div></div>`); }
function saveKB(id){ const k=DB.kb.find(x=>x.id===id); if(!k) return; k.title=((document.getElementById('kb_title')||{}).value||'').trim(); k.category=((document.getElementById('kb_cat')||{}).value||'').trim(); k.body=(document.getElementById('kb_body')||{}).value||''; closeModal(); saveDB(); render(); }
function delKB(id){ if(!confirm('Delete?')) return; DB.kb=DB.kb.filter(x=>x.id!==id); closeModal(); saveDB(); render(); }

const PROJECT_STATUSES=['Planning','Active','On Hold','Complete'];
const PROJECT_TYPES=['Drop Campaign','Product Launch','Website','Marketing','Operations','Finance','Other'];
const projById = id => (DB.projects||[]).find(p=>p.id===id);
function vProjects(){ return `<div class="page-head"><div><h2>Projects</h2></div><div class="page-actions"><button class="btn btn-gold" onclick="newProject()">＋ New Project</button></div></div>
  <div class="grid">${(DB.projects||[]).length?(DB.projects||[]).map(p=>{ const tasks=(DB.tasks||[]).filter(t=>t.projectId===p.id); const done=tasks.filter(t=>t.done).length; return `<div class="gcard" onclick="go('project','${p.id}')"><div class="gbody"><div class="gtitle">${esc(p.name)}</div><div class="gsub">${esc(p.type||'')} · <span class="pill pill-type" style="font-size:9.5px">${esc(p.status)}</span></div>${tasks.length?`<div style="margin-top:8px;height:4px;background:var(--line);border-radius:2px"><div style="height:100%;width:${done/tasks.length*100}%;background:var(--gold);border-radius:2px"></div></div><div style="font-size:11px;color:var(--ink3);margin-top:4px">${done}/${tasks.length} tasks done</div>`:''}</div></div>`; }).join(''):`<div class="empty">No projects yet.</div>`}`;
}
function vProject(){ const p=projById(route.id); if(!p) return `<div class="empty">Not found. <span class="link" onclick="go('projects')">Back</span></div>`; const tasks=(DB.tasks||[]).filter(t=>t.projectId===p.id); const done=tasks.filter(t=>t.done).length; return `<div class="page-head"><div><h2>${esc(p.name)}</h2><div class="desc">${esc(p.type||'')} · ${esc(p.status)}</div></div><div class="page-actions"><span class="link" onclick="go('projects')">← Projects</span><button class="btn btn-sm btn-danger" onclick="delProject('${p.id}')" style="margin-left:10px">Delete</button></div></div>
  <div class="kpi-row"><div class="kpi"><div class="label">Tasks</div><div class="val">${tasks.length}</div></div><div class="kpi"><div class="label">Done</div><div class="val green">${done}</div></div><div class="kpi"><div class="label">Status</div><div class="val">${esc(p.status)}</div></div></div>
  <div class="two-col"><div class="card"><div class="card-h"><h3>Details</h3></div><div class="modal-b" style="max-height:none"><div class="field"><label>Name</label><input value="${esc(p.name)}" onchange="updProj('${p.id}','name',this.value)"></div><div class="field"><label>Status</label>${dd('proj_status_'+p.id,PROJECT_STATUSES,p.status,'(id,v)=>updProj("${p.id}","status",v)')}</div><div class="field"><label>Notes</label><textarea onchange="updProj('${p.id}','notes',this.value)">${esc(p.notes||'')}</textarea></div></div></div>
  <div class="card"><div class="card-h"><h3>Tasks</h3><button class="btn btn-sm btn-gold" onclick="newProjectTask('${p.id}')">＋</button></div><div class="card-b">${tasks.length?tasks.map(t=>taskRow(t)).join(''):'<div class="empty">No tasks.</div>'}</div></div></div>`;
}
function newProject(){ const p={id:uid('proj'),name:'New Project',type:PROJECT_TYPES[0],status:'Planning',notes:'',tasks:[],created:now()}; DB.projects=DB.projects||[]; DB.projects.push(p); saveDB(); go('project',p.id); }
function updProj(id,field,val){ const p=projById(id); if(!p) return; p[field]=val; queueSave(); }
function delProject(id){ if(!confirm('Delete project?')) return; DB.projects=(DB.projects||[]).filter(x=>x.id!==id); saveDB(); go('projects'); }
function newProjectTask(projId){ const t={id:uid('task'),title:'New task',type:'Other',category:'Task',assignedTo:teamList()[0],due:today(),done:false,notes:'',dropId:'',projectId:projId,urgent:false,repeat:'None',recurring:false,created:now()}; DB.tasks.push(t); queueSave(); openTask(t.id); }

const PLAN_HOURS=Array.from({length:15},(v,i)=>{ const h=7+i; return h<12?h+':00 AM':(h===12?'12:00 PM':(h-12)+':00 PM'); });
function vPlanning(){
  const viewDate=today(); const tasks=DB.tasks.filter(t=>t.due===viewDate&&!t.done);
  return `<div class="page-head"><div><h2>Planning</h2><div class="desc">${fmtDate(viewDate)}</div></div><div class="page-actions"><button class="btn btn-gold" onclick="newTask()">＋ New Task</button></div></div>
  <div class="two-col">
    <div class="card"><div class="card-h"><h3>Due Today</h3></div><div class="card-b">${tasks.length?tasks.map(t=>taskRow(t)).join(''):'<div class="empty">Nothing due today.</div>'}</div></div>
    <div class="card"><div class="card-h"><h3>Day Schedule</h3></div><div class="modal-b" style="max-height:none">${PLAN_HOURS.map(h=>`<div style="display:flex;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)"><span style="font-size:11.5px;color:var(--ink3);width:76px;flex-shrink:0">${h}</span><div style="flex:1;min-height:24px"></div></div>`).join('')}</div></div>
  </div>`;
}

function mInput(id,label,val){ return `<div class="field"><label>${label}</label><input id="${id}" value="${esc(val||'')}"></div>`; }
function mNum(id,label,val){ return `<div class="field"><label>${label}</label><input id="${id}" type="number" value="${val||0}"></div>`; }
function mArea(id,label,val){ return `<div class="field"><label>${label}</label><textarea id="${id}">${esc(val||'')}</textarea></div>`; }

const SERIES_PREFIX={'Main Drop':'D','Weekend Drop':'W','Tech Drop':'T','Vault':'V','Free Drop':'FD'};
const SERIES_DEFAULTS={'Main Drop':{price:19.99,pool:499},'Weekend Drop':{price:5.99,pool:399},'Tech Drop':{price:9.99,pool:249},'Vault':{price:1.99,pool:99999},'Free Drop':{price:0,pool:1999}};
function newDrop(){
  const type='Main Drop'; const prefix=SERIES_PREFIX[type]; const existingNumbers=(DB.drops||[]).filter(d=>d.type===type).map(d=>parseInt((d.number||'').replace(/\D/g,''))).filter(n=>!isNaN(n));
  const next=(existingNumbers.length?Math.max(...existingNumbers)+1:1);
  const defaults=SERIES_DEFAULTS[type]||{price:9.99,pool:499};
  const d={id:uid('drop'),number:prefix+next,type,status:'Draft',watchId:'',supplierId:'',launch:today(),draw:addDays(today(),7),price:defaults.price,discountPrice:0,pool:defaults.pool,entriesSold:0,revenue:0,costWatch:0,costFixed:0,variableCosts:[],notes:'',websiteLink:'',dropId:'',copy:{headline:'',body:'',seoKeyphrase:'',seoTitle:'',slug:'',metaDescription:''},images:{main:'',cat1:'',cat2:'',cat3:'',webHero:'',phoneHero:''},entrants:{filename:'',headers:[],rows:[]},marketing:[],scripts:[],ads:[],links:{drive:'',canva:''},winner:'',winnerId:'',perf:{},tracker:{},created:now()};
  migrateDrop(d); DB.drops.push(d); logTL(d.id,'Drop created: '+d.number); saveDB(); go('drop',d.id,'overview'); toast('Drop created: '+d.number);
}
function updDrop(path,val){ const d=dropById(route.id); if(!d) return; const parts=path.split('.'); let obj=d; parts.slice(0,-1).forEach(p=>{ obj[p]=obj[p]||{}; obj=obj[p]; }); const key=parts[parts.length-1]; if(['price','pool','entriesSold','revenue','costWatch','costFixed'].includes(key)) obj[key]=Number(val)||0; else obj[key]=val; queueSave(); }
function setDropStatus(dropId,status){ const d=dropById(dropId); if(!d) return; d.status=status; logTL(dropId,'Status changed to '+status); saveDB(); render(); toast(d.number+' → '+status); }
function delDrop(id){ if(!confirm('Delete this drop? This cannot be undone.')) return; DB.drops=DB.drops.filter(x=>x.id!==id); saveDB(); go('drops'); toast('Drop deleted'); }
function addVarCost(dropId){ const d=dropById(dropId); if(!d) return; const label=(document.getElementById('vc_label_'+dropId)||{}).value||''; const amount=Number((document.getElementById('vc_amount_'+dropId)||{}).value)||0; if(!label) return; d.variableCosts=d.variableCosts||[]; d.variableCosts.push({id:uid('vc'),label,amount}); if(document.getElementById('vc_label_'+dropId)) document.getElementById('vc_label_'+dropId).value=''; if(document.getElementById('vc_amount_'+dropId)) document.getElementById('vc_amount_'+dropId).value=''; queueSave(); render(); }
function delVarCost(dropId,id){ const d=dropById(dropId); if(!d) return; d.variableCosts=d.variableCosts.filter(c=>c.id!==id); queueSave(); render(); }
function drawWinner(dropId){ const d=dropById(dropId); if(!d) return; const w={id:uid('win'),name:'',ticketNumber:'',dropId,phone:'',email:'',instagram:'',address:'',location:'',postcode:'',dispatched:false,deliveryInPerson:false,trackingNumber:'',review:'',reviewRequested:false,reviewGiven:false,notes:'',created:now()}; DB.winners.push(w); d.winnerId=w.id; saveDB(); openWinner(w.id); }

function universalSearch(q){ const r=document.getElementById('sresults'); if(!q.trim()){ r.style.display='none'; return; } r.style.display='block'; const res=[]; (DB.drops||[]).forEach(d=>{ if((d.number+watchName(d.watchId)).toLowerCase().includes(q.toLowerCase())) res.push({type:'drop',label:d.number+' — '+watchName(d.watchId),id:d.id}); }); (DB.watches||[]).forEach(w=>{ if((w.brand+' '+w.model+' '+w.ref).toLowerCase().includes(q.toLowerCase())) res.push({type:'watch',label:w.brand+' '+w.model,id:w.id}); }); (DB.winners||[]).forEach(w=>{ if((w.name||'').toLowerCase().includes(q.toLowerCase())) res.push({type:'winner',label:w.name,id:w.id}); }); (DB.tasks||[]).forEach(t=>{ if((t.title||'').toLowerCase().includes(q.toLowerCase())) res.push({type:'task',label:t.title,id:t.id}); }); if(!res.length){ r.innerHTML='<div class="sresult-group">No results</div>'; return; } r.innerHTML=res.slice(0,10).map(x=>`<div class="sresult" onclick="pickSearch('${x.type}','${x.id}')"><span class="ri">${x.type==='drop'?'⬡':x.type==='watch'?'⌚':x.type==='winner'?'✦':'☑'}</span><span class="rt">${esc(x.label)}</span><span class="rtype">${x.type}</span></div>`).join(''); }
function pickSearch(type,id){ document.getElementById('sresults').style.display='none'; document.getElementById('search').value=''; if(type==='drop') go('drop',id); else if(type==='watch'){ go('watches');setTimeout(()=>openWatch(id),80); } else if(type==='winner'){ go('winners');setTimeout(()=>openWinner(id),80); } else if(type==='task') openTask(id); }
document.getElementById('search').addEventListener('input',e=>universalSearch(e.target.value));

function openModal(html){ const overlay=document.createElement('div'); overlay.className='overlay'; overlay.id='overlay'; overlay.innerHTML=html; overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); }); document.body.appendChild(overlay); setTimeout(()=>{ const inp=overlay.querySelector('input:not([type=file]):not([type=checkbox])'); if(inp) inp.focus(); },80); }
function closeModal(){ const overlay=document.getElementById('overlay'); if(overlay){ overlay.remove(); const d=dropById(route.id); if(d&&d.tracker){ const t=d.tracker; } render(); } }

function toast(msg){ let t=document.getElementById('toastEl'); if(t) t.remove(); t=document.createElement('div'); t.id='toastEl'; t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }

checkSessionAndBoot();
</script>
