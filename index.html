function updCalc(sid, field, val){
  if(!calcState[sid]) return;
  const s = calcState[sid];
  if(field==='paymentFeePctPct') s.paymentFeePct = (Number(val)||0)/100;
  else if(field==='launchDiscPctPct') s.launchDiscPct = (Number(val)||0)/100;
  else if(field==='compLifeDiscPctPct') s.compLifeDiscPct = (Number(val)||0)/100;
  else s[field] = Number(val)||0;
  // Re-render just the calculator tab without full render (keep focus)
  const d = DB.drops.find(x=>'calc_'+x.id===sid);
  if(d) document.getElementById('hubtab').innerHTML = dropCalculator(d);
}

function runCalcBenchmarks(dropId, sid){
  const d = dropById(dropId); if(!d) return;
  const s = calcState[sid]||initCalcState(d);
  const btn = document.getElementById('bench_btn_'+dropId);
  const box = document.getElementById('calc_bench_'+dropId);
  if(!btn||!box) return;

  // Spinning animation
  btn.innerHTML = '<span class="calc-spinning">⟳</span> Running…';
  btn.disabled = true;

  const peers = DB.drops.filter(x=>x.type===d.type && x.id!==dropId && ['Complete','Closed'].includes(x.status))
    .sort((a,b)=>(b.draw||'').localeCompare(a.draw||'')).slice(0,3);

  setTimeout(()=>{
    // Flash the whole card
    const card = btn.closest('.card');
    if(card) card.classList.add('calc-flash');
    setTimeout(()=>card&&card.classList.remove('calc-flash'), 700);

    if(!peers.length){
      box.innerHTML = '<div class="empty">No previous drops to compare against.</div>';
      btn.innerHTML = '▶ Run Scenarios'; btn.disabled=false; return;
    }

    const scenarios = [30,50,70,90,100];
    let html = `<div style="overflow-x:auto;padding:0 4px 4px">
      <table class="tbl">
        <thead><tr>
          <th>Sell-through</th>
          <th style="color:var(--gold2)">This Drop</th>
          ${peers.map(p=>`<th class="muted">${esc(p.number)} actual</th>`).join('')}
        </tr></thead>
        <tbody>`;

    scenarios.forEach((pct,i)=>{
      const r = calcP(s, pct);
      html += `<tr class="calc-result-card" style="animation-delay:${i*0.08}s">
        <td><span class="pill ${r.netProfit>=0?'pill-done':'pill-closed'}" style="font-size:11px">${pct}%</span></td>
        <td style="font-weight:700;color:${r.netProfit>=0?'var(--live)':'var(--danger)'};">${gbp(r.netProfit)}</td>`;
      peers.forEach(p=>{
        const n = dropNumbers(p);
        const peerFill = n.pool? Math.round(n.entries/n.pool*100) : 0;
        const close = Math.abs(peerFill-pct)<=15;
        html += `<td class="muted" style="${close?'color:var(--ink);font-weight:600':''}">
          ${close?`${gbp(n.profit)} <span style="font-size:10px">(${peerFill}% fill)</span>`:`<span style="opacity:.45">${peerFill}% fill</span>`}
        </td>`;
      });
      html += `</tr>`;
    });

    html += `</tbody></table></div>
    <div class="muted" style="font-size:11px;padding:10px 18px">Peer profits shown where their actual fill rate is within 15% of the scenario. Your current variables: ${gbp(s.price)}/ticket · ${s.pool} pool · ${gbp(s.watchCost)} watch · ${gbp(s.fixed)} fixed · ${gbp(s.adsBudget)} ads.</div>`;

    box.innerHTML = html;
    btn.innerHTML = '▶ Run Again'; btn.disabled=false;
  }, 900);
}

async function onContentMediaUpload(evt){
  const files=[...evt.target.files]; if(!files.length) return;
  const preview=document.getElementById('cn_media_preview'); if(!preview) return;
  for(const file of files){
    const isVideo = file.type.startsWith('video/');

    tempDiv.style.cssText='position:relative;width:64px;height:64px;border-radius:6px;overflow:hidden;border:1px solid var(--line2);flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--panel2)';
    tempDiv.innerHTML='<span style="font-size:10px;color:var(--ink3)">…</span>';
    preview.insertBefore(tempDiv, preview.lastElementChild||null);
    try{
      const fileToUpload = await convertToJpeg(file);
      const ref = await storeMedia(fileToUpload);
      const idx=[...preview.children].indexOf(tempDiv);
      if(isVideo){
        const urlInput=document.getElementById('cn_video_url');
        if(urlInput) urlInput.value=ref;
        tempDiv.innerHTML=`<video src="${mediaUrl(ref)}" style="width:100%;height:100%;object-fit:cover" preload="metadata" muted></video><span onclick="this.parentNode.remove()" style="position:absolute;top:2px;right:2px;background:rgba(11,18,32,.85);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer">×</span>`;
        const vEl=tempDiv.querySelector('video'); if(vEl) vEl.load();
      } else {
        tempDiv.innerHTML=`<img data-mediaref="${ref}" style="width:100%;height:100%;object-fit:cover"><span onclick="this.parentNode.remove()" style="position:absolute;top:2px;right:2px;background:rgba(11,18,32,.85);color:#fff;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;cursor:pointer">×</span>`;
        setTimeout(hydrateMedia, 50);
        // Store ref in a hidden input list for saving
        const list=document.getElementById('cn_images_list')||(()=>{const i=document.createElement('div');i.id='cn_images_list';i.style.display='none';preview.parentNode.appendChild(i);return i;})();
        const inp=document.createElement('input'); inp.type='hidden'; inp.name='cn_img'; inp.value=ref;

function updVaultTickets(dropId, val){
  const d=dropById(dropId); if(!d||!d.vaultPriceHistory) return;
  const total=Math.max(0,Number(val)||0);
  const lockedT=d.vaultPriceHistory.filter(h=>h.locked).reduce((a,h)=>a+(Number(h.tickets)||0),0);
  const current=d.vaultPriceHistory[d.vaultPriceHistory.length-1];
  // Current period = total minus all locked periods
  current.tickets=Math.max(0,total-lockedT);
  d.tracker=d.tracker||{}; d.tracker.ticketsSoldTotal=total;
  queueSave(); render();
}
function updVaultCreditPct(dropId, val){
  const d=dropById(dropId); if(!d) return;
  d.tracker=d.tracker||{}; d.tracker.creditRedemptionPct=Math.min(100,Math.max(0,Number(val)||0));
  queueSave(); render();
}
function changeVaultPrice(dropId, newPrice){
  const d=dropById(dropId); if(!d||!d.vaultPriceHistory) return;
  const price=Math.round(Number(newPrice)*100)/100;
  if(!price||price<=0){ render(); return; }
  const current=d.vaultPriceHistory[d.vaultPriceHistory.length-1];
  if(price===Number(current.price)){ render(); return; }
  // Lock current segment
  current.locked=true;
  // Start new segment at new price with 0 tickets
  d.vaultPriceHistory.push({id:uid('vph'),price,tickets:0,from:today(),locked:false});
  d.tracker=d.tracker||{}; d.tracker.fullTicketPrice=price;
  saveDB(); render();
}

function ggStar(size,color){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${color}" style="display:block"><path d="M12 2l2.9 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77 5.82 21l1.18-6.88-5-4.87 7.1-1.01L12 2z"/></svg>`;
}
function ggLayoutPhoto(){
  const s=ggState, k=s.W/1080, img=ggEl('gg_img');
  if(!img) return;
  if(!s.imgSrc || !ggAspect){
    img.style.display='none';
    const ph=ggEl('gg_placeholder'); if(ph){ph.style.display='block';ph.style.fontSize=(20*k)+'px';}
    ggEl('gg_ground').style.display='none'; return;
  }
  img.style.display='block';
  ggEl('gg_placeholder').style.display='none';
  const cardAspect=s.W/s.H; let baseW,baseH;
  if(s.fit==='cover'){ if(ggAspect>cardAspect){baseH=s.H;baseW=s.H*ggAspect;}else{baseW=s.W;baseH=s.W/ggAspect;} }
  else { if(ggAspect>cardAspect){baseW=s.W;baseH=s.W/ggAspect;}else{baseH=s.H;baseW=s.H*ggAspect;} }
  const sc=s.photoSize/100, w=baseW*sc, h=baseH*sc;
  const xOff=s.photoX/100*s.W, yOff=s.photoY/100*s.H;
  const left=(s.W-w)/2+xOff, top=(s.H-h)/2+yOff;
  img.style.width=w+'px'; img.style.height=h+'px'; img.style.left=left+'px'; img.style.top=top+'px';
  img.style.transformOrigin='center center';
  img.style.transform=s.photoRot?`rotate(${s.photoRot}deg)`:'none';
  img.style.opacity=s.photoOpacity/100;
  const g=ggEl('gg_ground');
  if(s.showGround){ const gw=w*0.62,gh=Math.max(10,h*0.06);
    g.style.display='block'; g.style.width=gw+'px'; g.style.height=gh+'px';
    g.style.left=(left+w/2-gw/2)+'px'; g.style.top=(top+h-gh*0.5)+'px';
  } else g.style.display='none';
  ggEl('gg_photoLayer').style.zIndex = s.layer==='front'?15:1;
}
function ggRender(){
  const s=ggState, card=ggEl('ggCard'); if(!card) return;
  card.style.width=s.W+'px'; card.style.height=s.H+'px';
  const k=s.W/1080, p=[];
  if(s.headline.trim()) p.push(`<div class="headline" style="font-size:${88*k}px;margin-bottom:${10*k}px">${esc(s.headline)}</div>`);
  if(s.brand.trim())    p.push(`<div class="brand" style="font-size:${58*k}px;letter-spacing:${8*k}px">${esc(s.brand)}</div>`);
  if(s.model.trim())    p.push(`<div class="model" style="font-size:${138*k}px;color:${s.modelColor}">${esc(s.model)}</div>`);
  if(s.edition.trim())  p.push(`<div class="edition" style="font-size:${46*k}px">${esc(s.edition)}</div>`);
  if(s.editionLabel.trim()) p.push(`<div class="editionLabel" style="font-size:${24*k}px;letter-spacing:${6*k}px;margin-top:${6*k}px">${esc(s.editionLabel)}</div>`);
  const hasValue=s.valueLabel.trim()||s.valueAmount.trim();
  if(hasValue){
    p.push(`<div class="rule" style="width:62%;margin-top:${16*k}px;margin-bottom:${12*k}px"></div>`);
    const sep=(s.valueLabel.trim()&&s.valueAmount.trim())?` <span style="color:#6f7d95">|</span> `:'';
    p.push(`<div class="value" style="font-size:${34*k}px">${esc(s.valueLabel)}${sep}<span class="amt">${esc(s.valueAmount)}</span></div>`);
    p.push(`<div class="rule" style="width:62%;margin-top:${12*k}px;margin-bottom:${16*k}px"></div>`);
  }
  if(s.showTrust){
    const sz=30*k; let st='';
    for(let i=0;i<s.stars;i++) st+=`<span class="tstar" style="background:${s.starColor};width:${sz}px;height:${sz}px;margin-right:${4*k}px">${ggStar(sz*0.78,'#fff')}</span>`;
    p.push(`<div class="trust" style="font-size:${30*k}px;gap:${10*k}px;margin-top:${hasValue?0:14*k}px">${ggStar(34*k,s.starColor)}<span>${esc(s.trustLabel)}</span><span class="stars">${st}</span></div>`);
  }
  ggEl('gg_header').innerHTML=p.join('');
  if(s.imgSrc) ggEl('gg_img').src=s.imgSrc;
  ggLayoutPhoto();
  const scrim=ggEl('gg_scrim');
  if(s.dim>0){ const a=s.dim/100; scrim.style.background=`linear-gradient(180deg, rgba(9,21,41,${a*0.9}) 0%, rgba(9,21,41,${a*0.5}) 45%, rgba(13,28,55,${a*0.95}) 100%)`; }
  else scrim.style.background='transparent';
  const f=[];
  if(s.discount.trim()) f.push(`<div class="discount" style="font-size:${76*k}px;margin-bottom:${20*k}px">${esc(s.discount)}</div>`);
  if(s.showPrice&&(s.oldPrice.trim()||s.newPrice.trim())){
    const o=s.oldPrice.trim()?`<span class="oldp" style="font-size:${52*k}px">${esc(s.oldPrice)}<span class="strike"></span></span>`:'';
    const ar=(s.oldPrice.trim()&&s.newPrice.trim())?`<span class="arrow" style="font-size:${44*k}px">→</span>`:'';
    const n=s.newPrice.trim()?`<span class="newp" style="font-size:${56*k}px">${esc(s.newPrice)}</span>`:'';
    f.push(`<div class="pricebox" style="gap:${18*k}px;padding:${14*k}px ${28*k}px;border-radius:${16*k}px">${o}${ar}${n}</div>`);
  }
  ggEl('gg_footer').innerHTML=f.join('');
  ggEl('gg_footer').style.marginBottom=(10*k)+'px';
  card.querySelector('.pad').style.padding=`${64*k}px ${58*k}px`;
  const logo=ggEl('gg_logo');
  if(s.showLogo&&s.logoText.trim()){ logo.style.display='block'; logo.style.fontSize=(34*k)+'px'; logo.style.letterSpacing=(3*k)+'px'; logo.style.left=(52*k)+'px'; logo.style.bottom=(46*k)+'px'; logo.innerHTML=esc(s.logoText).replace(/\n/g,'<br>'); }
  else logo.style.display='none';
  ggFit();
}
function ggFit(){
  const prev=ggEl('ggPreview'), card=ggEl('ggCard'), frame=ggEl('ggFrame'); if(!prev||!card) return;
  const s=Math.min((prev.clientWidth-60)/ggState.W,(prev.clientHeight-60)/ggState.H,1);
  card.style.transform=`scale(${s})`;
  frame.style.width=(ggState.W*s)+'px'; frame.style.height=(ggState.H*s)+'px';
}
function ggSyncAll(){
  const s=ggState;
  ['headline','brand','model','edition','editionLabel','valueLabel','valueAmount','trustLabel','discount','oldPrice','newPrice','logoText'].forEach(kk=>{ const el=ggEl('gg_'+kk); if(el) el.value=s[kk]; });
  ggEl('gg_showTrust').checked=s.showTrust; ggEl('gg_showPrice').checked=s.showPrice; ggEl('gg_showLogo').checked=s.showLogo; ggEl('gg_showGround').checked=s.showGround;
  const setR=(id,v,suf='')=>{ ggEl('gg_'+id).value=v; ggEl('gg_'+id+'Val').textContent=v+suf; };
  setR('stars',s.stars); setR('photoSize',s.photoSize,'%'); setR('photoX',s.photoX); setR('photoY',s.photoY);
  setR('photoRot',s.photoRot,'°'); setR('photoOpacity',s.photoOpacity,'%'); setR('dim',s.dim,'%');
  const act=(wrap,fn)=>[...ggEl(wrap).children].forEach(c=>c.classList.toggle('active',fn(c)));
  act('gg_layerChips',c=>c.dataset.l===s.layer);
  act('gg_fitChips',c=>c.dataset.f===s.fit);
  act('gg_formatChips',c=>+c.dataset.w===s.W&&+c.dataset.h===s.H);
  act('gg_modelColor',c=>c.dataset.c===s.modelColor);
  act('gg_starSwatches',c=>c.dataset.c===s.starColor);
  act('gg_posPresets',()=>false);
  if(s.imgSrc){ const nm=ggEl('gg_photoName'); if(nm) nm.textContent='Photo loaded'; }
}
const GG_PRESETS={
  centre:{photoX:0,photoY:0,photoSize:72,fit:'contain',layer:'front',photoRot:0,dim:0},
  fill:{photoX:0,photoY:0,photoSize:110,fit:'cover',layer:'behind',photoRot:0,dim:38},
  top:{photoY:-30},bottom:{photoY:28},left:{photoX:-30},right:{photoX:30},
  reset:{photoX:0,photoY:6,photoSize:64,fit:'contain',layer:'behind',photoRot:0,photoOpacity:100,dim:0}
};
function ggBootLaunch(){
  ggSyncAll();
  const s=ggState;
  const bindT=kk=>{ ggEl('gg_'+kk).oninput=e=>{ s[kk]=e.target.value; ggRender(); }; };
  ['headline','brand','model','edition','editionLabel','valueLabel','valueAmount','trustLabel','discount','oldPrice','newPrice','logoText'].forEach(bindT);
  ggEl('gg_showTrust').onchange=e=>{s.showTrust=e.target.checked;ggRender();};
  ggEl('gg_showPrice').onchange=e=>{s.showPrice=e.target.checked;ggRender();};
  ggEl('gg_showLogo').onchange=e=>{s.showLogo=e.target.checked;ggRender();};
  ggEl('gg_showGround').onchange=e=>{s.showGround=e.target.checked;ggRender();};
  const bindR=(id,suf='')=>{ ggEl('gg_'+id).oninput=e=>{ s[id]=+e.target.value; ggEl('gg_'+id+'Val').textContent=e.target.value+suf; ggRender(); }; };
  bindR('stars'); bindR('photoSize','%'); bindR('photoX'); bindR('photoY'); bindR('photoRot','°'); bindR('photoOpacity','%'); bindR('dim','%');
  const chip=(wrap,fn)=>{ ggEl(wrap).onclick=e=>{ const c=e.target.closest('.gg-chip'); if(!c)return; [...e.currentTarget.children].forEach(x=>x.classList.remove('active')); c.classList.add('active'); fn(c); ggRender(); }; };
  chip('gg_layerChips',c=>s.layer=c.dataset.l);
  chip('gg_fitChips',c=>s.fit=c.dataset.f);
  chip('gg_formatChips',c=>{s.W=+c.dataset.w;s.H=+c.dataset.h;});
  chip('gg_modelColor',c=>s.modelColor=c.dataset.c);
  ggEl('gg_starSwatches').onclick=e=>{ const sw=e.target.closest('.gg-swatch'); if(!sw)return; [...e.currentTarget.children].forEach(x=>x.classList.remove('active')); sw.classList.add('active'); s.starColor=sw.dataset.c; ggRender(); };
  ggEl('gg_posPresets').onclick=e=>{ const c=e.target.closest('.gg-chip'); if(!c)return; Object.assign(s,GG_PRESETS[c.dataset.p]||{}); ggSyncAll(); ggRender(); };
  ggEl('gg_photoInput').onchange=e=>{
    const file=e.target.files[0]; e.target.value=''; if(!file)return;
    ggEl('gg_photoName').textContent=file.name.length>22?file.name.slice(0,20)+'…':file.name;
    const rd=new FileReader();
    rd.onload=()=>{ const pr=new Image(); pr.onload=()=>{ ggAspect=pr.naturalWidth/pr.naturalHeight; s.imgSrc=rd.result; ggRender(); }; pr.onerror=()=>alert('That image could not be loaded — try another file.'); pr.src=rd.result; };
    rd.readAsDataURL(file);
  };
  ggEl('gg_download').onclick=async ()=>{
    const btn=ggEl('gg_download'); const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='Rendering…';
    try{
      await document.fonts.ready;
      const scale=+ggEl('gg_quality').value; const card=ggEl('ggCard');
      const prevT=card.style.transform; card.style.transform='none';
      const canvas=await html2canvas(card,{scale,backgroundColor:null,useCORS:true,logging:false,width:s.W,height:s.H});
      card.style.transform=prevT;
      const link=document.createElement('a');
      link.download=((s.brand+'-'+s.model).replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-|-$/g,'')||'watch-drop')+'.png';
      link.href=canvas.toDataURL('image/png'); link.click();
    }catch(err){ alert('Export failed: '+err.message); }
    finally{ btn.disabled=false; btn.innerHTML=orig; ggFit(); }
  };
  document.fonts.ready.then(ggRender);
  ggRender();
}

function geFit(){

function geSync(){

  setR('heroW',s.heroW,'%'); setR('heroSize',s.heroSize,'%'); setR('heroX',s.heroX); setR('heroY',s.heroY); setR('dim',s.dim,'%');

function geReadFile(file, cb){ const r=new FileReader(); r.onload=()=>cb(r.result); r.readAsDataURL(file); }
function geBoot(){
  geSync();

  ['brand','model','edition','editionLabel','valueText','endsText','price','priceLabel','entries','entriesLabel'].forEach(bindT);
  const bindR=(id,suf='')=>{ ggEl('ge_'+id).oninput=e=>{ s[id]=+e.target.value; ggEl('ge_'+id+'Val').textContent=e.target.value+suf; geRender(); }; };
  bindR('heroW','%'); bindR('heroSize','%'); bindR('heroX'); bindR('heroY'); bindR('dim','%');
  const chip=(wrap,fn)=>{ ggEl(wrap).onclick=e=>{ const c=e.target.closest('.gg-chip'); if(!c)return; [...e.currentTarget.children].forEach(x=>x.classList.remove('active')); c.classList.add('active'); fn(c); geRender(); }; };
  chip('ge_formatChips',c=>{s.W=+c.dataset.w;s.H=+c.dataset.h;});
  chip('ge_modelColor',c=>s.modelColor=c.dataset.c);
  ggEl('ge_bgInput').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return; ggEl('ge_bgName').textContent='Background loaded'; geReadFile(f,d=>{ s.bgSrc=d; geRender(); }); };
  ggEl('ge_heroInput').onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return; ggEl('ge_heroName').textContent=f.name.length>18?f.name.slice(0,16)+'…':f.name; geReadFile(f,d=>{ const pr=new Image(); pr.onload=()=>{ geAspect=pr.naturalWidth/pr.naturalHeight; s.heroSrc=d; geRender(); }; pr.onerror=()=>alert('That image could not be loaded.'); pr.src=d; }); };
  [0,1,2].forEach(i=>{ ggEl('ge_thumb'+i).onchange=e=>{ const f=e.target.files[0]; e.target.value=''; if(!f)return; ggEl('ge_thumbName'+i).textContent='✓ '+(i+1); geReadFile(f,d=>{ s.thumbs[i]=d; geRender(); }); }; });
  ggEl('ge_download').onclick=async ()=>{
    const btn=ggEl('ge_download'); const orig=btn.innerHTML; btn.disabled=true; btn.innerHTML='Rendering…';
    try{
      await document.fonts.ready;
      const scale=+ggEl('ge_quality').value; const card=ggEl('geCard');
      const prevT=card.style.transform; card.style.transform='none';
      const canvas=await html2canvas(card,{scale,backgroundColor:null,useCORS:true,logging:false,width:s.W,height:s.H});
      card.style.transform=prevT;
      const link=document.createElement('a');
      link.download=((s.brand+'-'+s.model+'-email').replace(/[^a-z0-9]+/gi,'-').toLowerCase().replace(/^-|-$/g,'')||'watch-drop-email')+'.png';
      link.href=canvas.toDataURL('image/png'); link.click();
    }catch(err){ alert('Export failed: '+err.message); }
    finally{ btn.disabled=false; btn.innerHTML=orig; geFit(); }
  };
  document.fonts.ready.then(geRender);
  geRender();
}

/* ===== Script Reader / Teleprompter ===== */
let _srUtterance=null, _srSpeaking=false, _srRate=0.9, _srCharIndex=0, _srFullText='';
const SR_STEPS=20, SR_MIN=0.3, SR_MAX=2.0;
function srStepToRate(step){ return Math.round((SR_MIN+(step/SR_STEPS)*(SR_MAX-SR_MIN))*100)/100; }
function srRateToStep(rate){ return Math.round(((rate-SR_MIN)/(SR_MAX-SR_MIN))*SR_STEPS); }

function openScriptReaderById(scriptId, dropId){
  const d=dropId?dropById(dropId):null;
  const s=d?(d.scripts||[]).find(x=>x.id===scriptId):null;
  if(s){ openScriptReader(s.body||''); return; }
  const c=DB.content.find(x=>x.id===scriptId);
  if(c){ openScriptReader(c.body||''); return; }
  for(const dr of DB.drops){
    const found=(dr.scripts||[]).find(x=>x.id===scriptId);
    if(found){ openScriptReader(found.body||''); return; }
  }
  alert('Script not found');
}

function srBuildWordSpans(text){
  // Split into tokens preserving whitespace and newlines
  return text.replace(/([^\s]+)/g, (word, _, offset)=>`<span class="sr-word" data-ci="${offset}" onclick="srReadFrom(${offset})" style="cursor:pointer;border-radius:3px;padding:0 1px;transition:background .1s">${word}</span>`);
}

function openScriptReader(text){
  if(!text||!text.trim()){ alert('No script to read'); return; }
  window.speechSynthesis && window.speechSynthesis.cancel();
  _srSpeaking=false; _srCharIndex=0; _srFullText=text;

  const step=srRateToStep(_srRate);
  const overlay=document.createElement('div');
  overlay.id='scriptReaderOverlay';
  overlay.style.cssText='position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column;overflow:hidden';
  overlay.innerHTML=`
    <div style="flex:1;overflow-y:auto;padding:32px 24px 120px;-webkit-overflow-scrolling:touch" id="sr_scroll">
      <div id="sr_text" style="font-size:22px;line-height:1.9;color:#fff;word-break:break-word">${srBuildWordSpans(text)}</div>
    </div>
    <div style="position:fixed;bottom:0;left:0;right:0;background:rgba(0,0,0,.92);backdrop-filter:blur(10px);padding:14px 20px 28px;border-top:1px solid rgba(255,255,255,.1)">
      <div style="font-size:10px;color:rgba(255,255,255,.3);text-align:center;margin-bottom:8px">Tap any word to start reading from there</div>
      <div style="display:flex;align-items:center;gap:12px">
        <button id="sr_play" onclick="srToggle()" style="width:52px;height:52px;border-radius:50%;background:var(--gold);border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#000;flex-shrink:0">▶</button>
        <div style="flex:1">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
            <span style="font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.8px">Speed</span>
            <span id="sr_speed_label" style="font-size:13px;color:var(--gold);font-weight:700">${_srRate.toFixed(2)}×</span>
          </div>
          <div style="display:flex;align-items:center;gap:8px">
            <button onclick="srAdjustSpeed(-1)" style="background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:6px;font-size:16px;cursor:pointer;flex-shrink:0">−</button>
            <input id="sr_speed" type="range" min="0" max="${SR_STEPS}" step="1" value="${step}" oninput="srSetSpeed(parseInt(this.value))" style="flex:1;accent-color:var(--gold);height:4px">
            <button onclick="srAdjustSpeed(1)" style="background:rgba(255,255,255,.1);border:none;color:#fff;width:32px;height:32px;border-radius:6px;font-size:16px;cursor:pointer;flex-shrink:0">+</button>
          </div>
        </div>
        <button onclick="srClose()" style="background:rgba(255,255,255,.1);border:none;color:#fff;width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0">×</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
}

function srHighlightWord(charIndex){
  document.querySelectorAll('.sr-word').forEach(el=>{
    const ci=parseInt(el.dataset.ci);
    el.style.background = (ci===charIndex)?'rgba(201,162,75,.5)':'';
    el.style.color = (ci===charIndex)?'#fff':'';
  });
  // Scroll active word into view
  const active=document.querySelector(`.sr-word[data-ci="${charIndex}"]`);
  if(active) active.scrollIntoView({behavior:'smooth',block:'center'});
}

function srStartFrom(charIndex){
  window.speechSynthesis.cancel();
  _srCharIndex=charIndex;
  const textFromHere=_srFullText.slice(charIndex);
  _srUtterance=new SpeechSynthesisUtterance(textFromHere);
  _srUtterance.rate=_srRate;
  _srUtterance.onboundary=e=>{
    if(e.name==='word'){
      const absIdx=charIndex+e.charIndex;
      _srCharIndex=absIdx;
      srHighlightWord(absIdx);
    }
  };
  _srUtterance.onend=()=>{
    _srSpeaking=false;
    _srCharIndex=0;
    document.querySelectorAll('.sr-word').forEach(el=>{ el.style.background=''; el.style.color=''; });
    const b=document.getElementById('sr_play'); if(b) b.textContent='▶';
  };
  window.speechSynthesis.speak(_srUtterance);
  _srSpeaking=true;
  const b=document.getElementById('sr_play'); if(b) b.textContent='⏸';
}

function srReadFrom(charIndex){
  srStartFrom(charIndex);
}

function srToggle(){
  if(_srSpeaking){
    window.speechSynthesis.pause();
    _srSpeaking=false;
    document.getElementById('sr_play').textContent='▶';
  } else {
    if(window.speechSynthesis.paused){
      window.speechSynthesis.resume();
      _srSpeaking=true;
      document.getElementById('sr_play').textContent='⏸';
    } else {
      srStartFrom(_srCharIndex);
    }
  }
}

function srSetSpeed(step){
  _srRate=srStepToRate(step);
  const lbl=document.getElementById('sr_speed_label'); if(lbl) lbl.textContent=_srRate.toFixed(2)+'×';
  const sl=document.getElementById('sr_speed'); if(sl) sl.value=step;
  // If playing, restart from current position at new speed
  if(_srSpeaking || window.speechSynthesis.paused){
    srStartFrom(_srCharIndex);
  }
}

function srAdjustSpeed(delta){
  const sl=document.getElementById('sr_speed'); if(!sl) return;
  const newStep=Math.max(0,Math.min(SR_STEPS,parseInt(sl.value)+delta));
  srSetSpeed(newStep);
}

function srClose(){
  window.speechSynthesis && window.speechSynthesis.cancel();
  _srSpeaking=false; _srCharIndex=0;
  const el=document.getElementById('scriptReaderOverlay'); if(el) el.remove();
}

function vaultLiveBanner(d){
  if(!d.launch||!d.draw) return '';
  const now = new Date();
  const launch = new Date(d.launch);
  const draw = new Date(d.draw);
  const totalDays = Math.max(1, Math.round((draw-launch)/(1000*60*60*24)));
  const daysLive = Math.max(0, Math.round((now-launch)/(1000*60*60*24)));
  const daysLeft = Math.max(0, Math.round((draw-now)/(1000*60*60*24)));
  const pctThrough = Math.min(100, Math.round(daysLive/totalDays*100));

  // Ad spend pacing — £1k/week assumption
  const weeksLive = daysLive/7;
  const adPacePerWeek = Number((d.tracker||{}).adWeeklyBudget)||1000;
  const expectedAdSpend = Math.round(weeksLive*adPacePerWeek);
  const actualAdSpend = Number((d.tracker||{}).adsBudget)||0;
  const adDelta = actualAdSpend - expectedAdSpend;
  const adStatus = adDelta>100?'over':adDelta<-100?'under':'on track';
  const adColor = adStatus==='over'?'var(--danger)':adStatus==='under'?'var(--warn)':'var(--live)';

  return `<div class="card" style="margin-bottom:16px;border-color:var(--gold)">
    <div class="card-h"><h3>⏱ Vault Progress</h3>
      <span class="muted" style="font-size:11.5px">${daysLive} days live · ${daysLeft} days remaining</span>
    </div>
    <div style="padding:14px 18px">
      <!-- Timeline bar -->
      <div style="position:relative;height:10px;background:var(--panel2);border-radius:10px;margin-bottom:10px;overflow:hidden">
        <div style="position:absolute;left:0;top:0;height:100%;width:${pctThrough}%;background:var(--gold);border-radius:10px;transition:width .5s"></div>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);margin-bottom:16px">
        <span>${fmtDate(d.launch)}</span>
        <span style="color:var(--gold2);font-weight:700">${pctThrough}% through</span>
        <span>${fmtDate(d.draw)}</span>
      </div>
      <!-- Stats row -->
      <div style="display:flex;gap:12px;flex-wrap:wrap">
        <div style="flex:1;min-width:120px;background:var(--panel);border-radius:10px;padding:12px 14px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3)">Days Live</div>
          <div style="font-size:24px;font-weight:800;color:var(--ink)">${daysLive}</div>
          <div style="font-size:11px;color:var(--ink3)">${Math.round(weeksLive*10)/10} weeks</div>
        </div>
        <div style="flex:1;min-width:120px;background:var(--panel);border-radius:10px;padding:12px 14px">
          <div style="font-size:10px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3)">Days Left</div>
          <div style="font-size:24px;font-weight:800;color:${daysLeft<14?'var(--warn)':'var(--ink)'}">${daysLeft}</div>
          <div style="font-size:11px;color:var(--ink3)">${totalDays} total</div>
        </div>
        <div style="flex:2;min-width:180px;background:var(--panel);border-radius:10px;padding:12px 14px">

async function uploadAdAsset(evt, dropId, adId, format){

function saveMonthlyRevenue(){
  DB.monthlyRevenue=DB.monthlyRevenue||[];
  const months=[];
  for(let i=0;i<6;i++){
    const d=new Date(); d.setMonth(d.getMonth()-i);
    months.push(d.toISOString().slice(0,7));
  }
  months.forEach(m=>{
    const el=document.getElementById('mr_'+m); if(!el) return;
    const val=parseFloat(el.value);
    if(isNaN(val)||val<=0){ DB.monthlyRevenue=DB.monthlyRevenue.filter(r=>r.month!==m); return; }
    const existing=DB.monthlyRevenue.find(r=>r.month===m);
    if(existing) existing.actual=val;
    else DB.monthlyRevenue.push({month:m,actual:val,updated:now()});
  });
  saveDB(); closeModal(); render(); toast('Monthly revenue saved');
}

function parseMonthlyRevenueCSV(){
  const file=(document.getElementById('mr_csv_file')||{}).files&&document.getElementById('mr_csv_file').files[0];
  if(!file){ alert('Select a CSV first'); return; }
  const reader=new FileReader();
  reader.onload=()=>{
    const rows=parseCSV(reader.result);
    // Find amount column — look for 'amount','total','gross','settlement'
    const amtCol=rows.headers.find(h=>/amount|total|gross|settlement|net/i.test(h));
    const dateCol=rows.headers.find(h=>/date|time/i.test(h));
    if(!amtCol){ document.getElementById('mr_csv_result').textContent='Could not find an amount column. Try entering manually.'; return; }
    // Sum by month
    const byMonth={};
    rows.rows.forEach(row=>{
      const rawAmt=String(row[amtCol]||'').replace(/[£,\s]/g,'');
      const amt=parseFloat(rawAmt); if(isNaN(amt)||amt<=0) return;
      let month=new Date().toISOString().slice(0,7);
      if(dateCol&&row[dateCol]){
        const d=new Date(row[dateCol]);
        if(!isNaN(d)) month=d.toISOString().slice(0,7);
      }
      byMonth[month]=(byMonth[month]||0)+amt;
    });
    // Fill in fields
    Object.entries(byMonth).forEach(([m,total])=>{
      const el=document.getElementById('mr_'+m); if(el) el.value=total.toFixed(2);
    });
    const total=Object.values(byMonth).reduce((a,b)=>a+b,0);
    document.getElementById('mr_csv_result').textContent=`Parsed ${rows.rows.length} rows across ${Object.keys(byMonth).length} month(s). Total: £${total.toFixed(2)}. Review then Save.`;
  };
  reader.readAsText(file);
}

let _tcExpr='', _tcResult='0', _tcNewNum=true;
function toggleTrackerCalc(){
  const el=document.getElementById('tracker_calc_widget'); if(!el) return;
  el.style.display=el.style.display==='none'?'block':'none';
}
function tcKey(k){
  const disp=document.getElementById('tc_display'); if(!disp) return;
  if(k==='C'){ _tcExpr=''; _tcResult='0'; _tcNewNum=true; disp.textContent='0'; return; }
  if(k==='⌫'){
    _tcResult=_tcResult.length>1?_tcResult.slice(0,-1):'0';
    disp.textContent=_tcResult; return;
  }
  if(k==='='){
    try{
      const expr=(_tcExpr+_tcResult).replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/＋/g,'+');
      const val=Function('"use strict";return ('+expr+')')();
      _tcResult=parseFloat(val.toFixed(8)).toString();
      _tcExpr=''; _tcNewNum=true;
      disp.textContent=_tcResult;
    }catch(e){ disp.textContent='Error'; _tcExpr=''; _tcResult='0'; _tcNewNum=true; }
    return;
  }
  if(['÷','×','−','＋'].includes(k)){
    _tcExpr=(_tcExpr+_tcResult+k); _tcResult=''; _tcNewNum=true;
    disp.textContent=_tcExpr; return;
  }
  if(k==='%'){
    try{
      const val=parseFloat(_tcResult)/100;
      _tcResult=val.toString(); disp.textContent=_tcResult;
    }catch(e){}
    return;
  }
  if(k==='±'){
    _tcResult=_tcResult.startsWith('-')?_tcResult.slice(1):('-'+_tcResult);
    disp.textContent=_tcResult; return;
  }
  if(k==='.' && _tcResult.includes('.')) return;
  if(_tcNewNum){ _tcResult=(k==='.'?'0':'')+(k==='0'?'0':k); _tcNewNum=false; }
  else { _tcResult=(_tcResult==='0'&&k!=='.')?k:(_tcResult+k); }
  disp.textContent=_tcResult;
}

let planView='day', planDay=today(), planDragTask=null;

const PLAN_EST_OPTIONS = [
  {label:'15 min',mins:15},{label:'30 min',mins:30},{label:'45 min',mins:45},

function planDayLabel(d){ return new Date(d+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
function planAddDays(d,n){ const dt=new Date(d+'T12:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().slice(0,10); }
function planWeekDays(d){ const dow=new Date(d+'T12:00:00').getDay(); const mon=planAddDays(d,-(dow===0?6:dow-1)); return Array.from({length:5},(_,i)=>planAddDays(mon,i)); }

function vPlanning(){
  DB.tasks=DB.tasks||[];

  const days = planView==='day'?[planDay]:planWeekDays(planDay);

  // Unscheduled tasks — mine, not done, no scheduled date/time for these days

  const unscheduled = DB.tasks.filter(t=>!t.done && (t.assignedTo===myName||!t.assignedTo) && !t.scheduledDate);

  // Colour by category
  const taskColor = t => t.category==='Admin'?'var(--blue)':t.category==='Content'?'var(--purple)':'var(--gold2)';

  // Build task list panel
  const taskList = unscheduled.length
    ? unscheduled.map(t=>`

          </div>
        </div>`).join('')
    : '<div class="muted" style="font-size:12.5px;padding:8px 0">All tasks scheduled ✓</div>';

  // Build time grid
  const gridCols = days.length===1?'1fr':`repeat(${days.length},1fr)`;
  const SLOT_H = 56; // px per hour

  const dayHeaders = days.map(d=>`
    <div style="text-align:center;padding:8px 4px;font-size:12px;font-weight:700;color:${d===today()?'var(--gold2)':'var(--ink)'};border-bottom:1px solid var(--line2);background:${d===today()?'rgba(201,162,75,.08)':'var(--bg2)'}">

  let gridRows = '';
  PLAN_HOURS.forEach(h=>{
    const timeLabel=`${h===12?12:h>12?h-12:h}${h<12?'am':h===12?'pm':'pm'}`;
    const isNowHour = new Date().getHours()===h && days.includes(today());
    gridRows += `<div style="display:grid;grid-template-columns:52px ${gridCols};min-height:${SLOT_H}px;border-bottom:1px solid var(--line)">
      <div style="font-size:10px;color:var(--ink3);padding:4px 6px;text-align:right;border-right:1px solid var(--line2);${isNowHour?'color:var(--gold2);font-weight:700':''}">${timeLabel}</div>
      ${days.map(d=>{
        // Tasks scheduled in this hour
        const slotTasks = DB.tasks.filter(t=>t.scheduledDate===d && t.scheduledHour===h && !t.done);
        const dayName=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][new Date(d+'T12:00:00').getDay()];
        const recurTasks = (DB.tasks||[]).filter(t=>t.recurring&&t.recurringHour===h&&(t.recurringDays||[]).includes(dayName));
        return `<div class="plan-slot" data-day="${d}" data-hour="${h}"
          style="border-right:1px solid var(--line2);padding:2px 4px;position:relative;min-height:${SLOT_H}px;background:${isNowHour&&d===today()?'rgba(201,162,75,.04)':'transparent'}"

          ondragleave="this.style.background=''"
          ondrop="planDrop(event,'${d}',${h});this.style.background=''">
          ${slotTasks.map(t=>`
            <div style="background:${taskColor(t)};color:#fff;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:600;margin-bottom:2px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:4px"
              onclick="openTask('${t.id}')" title="${esc(t.title)}">
              <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.title)}</span>
              <span onclick="event.stopPropagation();planUnschedule('${t.id}')" style="opacity:.7;cursor:pointer;flex-shrink:0">×</span>
            </div>`).join('')}
          ${recurTasks.map(t=>`
            <div style="background:var(--panel2);border:1px dashed var(--line2);border-radius:5px;padding:3px 7px;font-size:10px;color:var(--ink3);margin-bottom:2px;opacity:.7"
              title="Recurring: ${esc(t.title)}">↻ ${esc(t.title)}</div>`).join('')}
        </div>`;
      }).join('')}
    </div>`;
  });

  return `<div class="page-head"><div><h2>Planning</h2><div class="desc">Time block your day — drag tasks into slots.</div></div>
    <div class="page-actions" style="display:flex;gap:8px;align-items:center">
      <button class="fbtn ${planView==='day'?'active':''}" onclick="planView='day';render()">Day</button>
      <button class="fbtn ${planView==='week'?'active':''}" onclick="planView='week';render()">Week</button>
      <button class="btn btn-sm btn-ghost" onclick="planDay=planAddDays(planDay,-1);render()">‹</button>
      <span style="font-size:13px;font-weight:600;color:var(--ink)">${planView==='day'?planDayLabel(planDay):'Week of '+planDayLabel(planWeekDays(planDay)[0])}</span>
      <button class="btn btn-sm btn-ghost" onclick="planDay=planAddDays(planDay,1);render()">›</button>
      <button class="btn btn-sm btn-ghost" onclick="planDay=today();render()">Today</button>
    </div></div>
  <div style="display:flex;gap:16px;height:calc(100vh - 160px);overflow:hidden">
    <!-- Task list panel -->
    <div style="width:240px;flex-shrink:0;display:flex;flex-direction:column;gap:0">
      <div style="font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--ink3);font-weight:700;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--line2)">
        Unscheduled (${unscheduled.length})
      </div>
      <div style="overflow-y:auto;flex:1;padding-right:4px">${taskList}</div>
    </div>
    <!-- Time grid -->
    <div style="flex:1;overflow-y:auto;border:1px solid var(--line2);border-radius:12px;overflow:hidden">
      <div style="display:grid;grid-template-columns:52px ${gridCols};position:sticky;top:0;z-index:2">
        <div style="background:var(--bg2);border-bottom:1px solid var(--line2);border-right:1px solid var(--line2)"></div>
        ${dayHeaders}
      </div>
      ${gridRows}
    </div>
  </div>`;
}

function planFmtEst(mins){
  if(!mins) return '';
  if(mins<60) return mins+'min';
  if(mins%60===0) return (mins/60)+'hr';
  return Math.floor(mins/60)+'hr '+(mins%60)+'min';
}

function planDrop(event, day, hour){
  event.preventDefault();
  const taskId = planDragTask||event.dataTransfer.getData('text/plain');
  if(!taskId) return;
  const t=DB.tasks.find(x=>x.id===taskId); if(!t) return;
  t.scheduledDate=day;
  t.scheduledHour=Number(hour);
  t.due=day; // also set the due date
  saveDB(); render();
  toast(`${t.title} → ${planDayLabel(day)} at ${hour<12?hour+'am':hour===12?'12pm':(hour-12)+'pm'}`);
}

function planUnschedule(taskId){
  const t=DB.tasks.find(x=>x.id===taskId); if(!t) return;
  delete t.scheduledDate; delete t.scheduledHour;
  saveDB(); render();
}

// Add est time slider to task modal — patch into openTask
const _origOpenTask = typeof openTask==='function'?openTask:null;

checkSessionAndBoot();
</script>
